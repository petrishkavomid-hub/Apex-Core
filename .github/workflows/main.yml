name: Build Apex AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Apex AI Fixes
        run: |
          git checkout bb021fd -- fix_all.py update_code.py final_fix.py
          pip install pillow -q && python3 fix_all.py && python3 update_code.py
          python3 -c 'p="app/src/main/java/com/apex/assistant/ApexCoreService.kt"; s=open(p).read(); s=s.replace("for (m in listOf(\"openai\", \"gemini\", \"openai-fast\", \"gpt-4o-mini\"))","for (m in listOf(\"gemini\", \"openai\", \"openai-fast\"))").replace("mainHandler.postDelayed({ startStopListener() }, 200)","").replace("workflows/build/main/Apex-AI-Update.zip","workflows/main/main/Apex-AI-Update.zip"); open(p,"w").write(s)'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Update
          path: app/build/outputs/apk/debug/app-debug.apk
          
