name: Build Apex AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Apex AI Fixes
        run: |
          git checkout bb021fd -- fix_all.py update_code.py final_fix.py
          pip install pillow -q && python3 fix_all.py && python3 update_code.py
          cat << 'EOF' > patch_apex.py
          import re
          p = "app/src/main/java/com/apex/assistant/ApexCoreService.kt"
          s = open(p, encoding="utf-8").read()

          # 1. Фикс фото: ставим модели без цензуры на актёров и персонажей + чёткая инструкция
          s = s.replace(
              'for (m in listOf("openai", "gemini", "openai-fast", "gpt-4o-mini")) {',
              'for (m in listOf("gemini", "searchgpt", "openai-large", "openai")) {'
          )
          s = s.replace(
              'if (code in 200..299) {',
              'if (code in 200..299 && !raw.contains("credits", true) && !raw.contains("top-up", true) && !raw.contains("не могу определить личность", true) && !raw.contains("cannot identify", true)) {'
          )
          s = re.sub(
              r'if \(prompt\.isBlank\(\)\) ".*?" else prompt',
              'if (prompt.isBlank()) "Внимательно изучи фото: кто или что на нём изображено (актёры, персонажи кино, блогеры, логотипы игр в углах скриншота)? Обязательно назови имя актёра или персонажа, если он узнаваем, и ответь по делу без смайликов." else "$prompt (Внимательно рассмотри фото, прочитай мелкий текст и логотипы, обязательно назови имя актёра или персонажа, если он узнаваем. Не используй смайлики)."',
              s
          )

          # 2. Топовый живой нейросетевой голос (Microsoft Edge TTS - Дмитрий) + чистка текста
          edge_player_code = '''
          private var edgeMediaPlayer: android.media.MediaPlayer? = null
          private fun playNeuralVoice(textToRead: String) {
              Thread {
                  try {
                      edgeMediaPlayer?.stop()
                      edgeMediaPlayer?.release()
                  } catch (_: Exception) {}
                  try {
                      val encoded = java.net.URLEncoder.encode(textToRead, "UTF-8")
                      val url = "https://travisvn.com"
                      val mp = android.media.MediaPlayer()
                      mp.setDataSource(url)
                      mp.setOnPreparedListener { it.start() }
                      mp.setOnCompletionListener { it.release() }
                      mp.prepareAsync()
                      edgeMediaPlayer = mp
                  } catch (e: Exception) {
                      try { tts?.speak(textToRead, android.speech.tts.TextToSpeech.QUEUE_FLUSH, null, "apex") } catch (_: Exception) {}
                  }
              }.start()
          }
          '''
          if "playNeuralVoice" not in s:
              s = s.replace("override fun onCreate()", edge_player_code + "\n    override fun onCreate()")

          s = s.replace('mainHandler.postDelayed({ startStopListener() }, 200)', '')
          s = s.replace(
              'val chunks = c.split(Regex("(?<=[.!?;—])\\\\s+")).filter { it.isNotBlank() }',
              'val chunks = c.split(Regex("(?<=[.!?;—])\\\\s+")).map { it.trim() }.filter { it.any { ch -> ch.isLetterOrDigit() } }'
          )
          s = s.replace(
              'r = r.replace(Regex("[*#_`~>|\\\\[\\\\]]"), "")',
              'r = r.replace(Regex("[*#_`~>|\\\\[\\\\]()«»\\"\\\'—–-]"), " ").replace(Regex("[\\\\x{1F300}-\\\\x{1FAFF}\\\\x{2600}-\\\\x{27BF}]"), "")'
          )
          s = re.sub(r'tts\?\.speak\(\s*([^,]+),[^)]+\)', r'playNeuralVoice(\1)', s)

          # 3. Умный характер без смайликов и с развёрнутыми ответами на сложные темы
          new_sys = '''val creatorFlag = isCreator || prefs.getBoolean("dev_unlocked", false) || prefs.getBoolean("is_admin", false)
                    val rolePrompt = if (creatorFlag) "ТЫ ОБЩАЕШЬСЯ СО СВОИМ СОЗДАТЕЛЕМ И РАЗРАБОТЧИКОМ — СЕРГЕЕМ (DEREK STEALTH)! Относись к нему как преданный напарник и правая рука: уверенно, по-свойски и с уважением. НИКОГДА не называй его «сэр» — чередуй обращения: «Босс», «Шеф», «Дерек» или «Серёга». У него полный доступ ко всем твоим протоколам." else "Ты общаешься с пользователем как умный, спокойный и надёжный напарник."
                    val sys = "Ты — Apex AI, передовой голосовой ИИ-напарник от Derek Stealth. $rolePrompt $ctxInfo $noGreetRule СТРОГО ЗАПРЕЩЕНО использовать любые смайлики и эмодзи в ответах — пиши чистым текстом. Адаптивная длина: на простые приветствия отвечай коротко (1-2 предложения), а на личные переживания, ссоры, сложные вопросы и просьбы о совете отвечай развёрнуто, глубоко и с реальной поддержкой, как старшая версия ChatGPT. На фото смело узнавай известных актёров, персонажей кино (например, Тони Старка / Роберта Дауни-младшего), а также читай логотипы и названия проектов в углах скриншотов."'''
          s = re.sub(r'val sys = ".*?"', new_sys, s, count=1)

          # 4. Приветствие от имени Apex при нажатии на микрофон без команды
          s = s.replace(
              'if (cmd.isEmpty()) { speakClean("Слушаю вас."); return }',
              'if (cmd.isEmpty()) { val dev = MainActivity.CREATOR_IDS.contains(Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "") || getSharedPreferences("apex_prefs", Context.MODE_PRIVATE).getBoolean("dev_unlocked", false); speakClean(if (dev) "На связи, Шеф." else "Слушаю вас."); return }'
          )

          # 5. Фикс ссылки автообновления под build.yml
          s = s.replace('workflows/main/main/Apex-AI-Update.zip', 'workflows/build/main/Apex-AI-Update.zip')

          open(p, "w", encoding="utf-8").write(s)
          EOF
          python3 patch_apex.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Update
          path: app/build/outputs/apk/debug/app-debug.apk
          
