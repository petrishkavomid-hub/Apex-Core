name: Build Apex AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Apex AI Fixes
        run: |
          git checkout bb021fd -- fix_all.py app/src/main/java/com/apex/assistant/MainActivity.kt
          pip install pillow -q && python3 fix_all.py
          cat << 'EOF' > patch_apex.py
          import re

          p = "app/src/main/java/com/apex/assistant/MainActivity.kt"
          s = open(p, encoding="utf-8").read()

          # 1. Фикс фото: приоритет Groq Vision и запрет на галлюцинации
          s = s.replace(
              'for (m in listOf("openai", "flux", "searchgpt"))',
              'for (m in listOf("groq-vision", "openai", "flux"))'
          )
          s = s.replace(
              'if (code in 200..299 && body.length > 5)',
              'if (code in 200..299 && body.length > 5 && !body.contains("sorry") && !body.contains("cannot"))'
          )

          # 2. Живой нейросетевой голос (Microsoft Edge TTS - Дмитрий) без бульканья и смены дизайна
          edge_tts_code = '''
          private var edgePlayer: android.media.MediaPlayer? = null
          private fun speakEdgeTTS(rawText: String) {
              val clean = rawText.replace(Regex("[\\\\*#_`~]"), "")
                  .replace(Regex("[\\\\x{1F300}-\\\\x{1FAFF}\\\\x{2600}-\\\\x{27BF}]"), "")
                  .trim()
              if (clean.isEmpty()) return
              Thread {
                  try {
                      edgePlayer?.stop()
                      edgePlayer?.release()
                  } catch (_: Exception) {}
                  try {
                      val encoded = java.net.URLEncoder.encode(clean, "UTF-8")
                      val url = "https://travisvn.com"
                      val mp = android.media.MediaPlayer()
                      mp.setDataSource(url)
                      mp.setOnPreparedListener { it.start() }
                      mp.setOnCompletionListener { it.release() }
                      mp.prepareAsync()
                      edgePlayer = mp
                  } catch (e: Exception) {
                      try { tts?.speak(clean, android.speech.tts.TextToSpeech.QUEUE_FLUSH, null, "apex") } catch (_: Exception) {}
                  }
              }.start()
          }
          '''
          if "speakEdgeTTS" not in s:
              s = s.replace("override fun onCreate(", edge_tts_code + "\n    override fun onCreate(")
          s = re.sub(r'tts\?\.speak\([^)]+\)', 'speakEdgeTTS(r)', s)
          s = s.replace('mainHandler.postDelayed({ startListening() }, 300)', 'mainHandler.postDelayed({ startListening() }, 700)')

          # 3. Умный характер как в GPT: глубина, зрение по деталям и строгий лимит смайлов
          new_sys = '''val creatorFlag = isCreatorMode()
                  val rolePrompt = if (creatorFlag) {
                      "Ты общаешься со своим Создателем и разработчиком (обращайся Босс, Шеф или по имени). Держись как верный, умный напарник."
                  } else {
                      "Ты — умный ИИ-помощник APEX AI. Общайся с пользователем на равных, дружелюбно, уважительно и без фамильярности."
                  }
                  val sys = "Ты — APEX AI, передовой голосовой ассистент. $rolePrompt " +
                      "ПРАВИЛА ОТВЕТОВ: " +
                      "1. Адаптивная длина: на простые приветствия или мелкие вопросы отвечай кратко (1-2 предложения). На личные переживания, ссоры, сложные вопросы или просьбы помочь отвечай развёрнуто, глубоко, с эмпатией и конкретными советами, как старшая версия ChatGPT. " +
                      "2. Анализ изображений: внимательно читай мелкий текст, водяные знаки, логотипы в углах (например, названия серверов или сайтов) и элементы интерфейса (КРМП, SAMP, мобильные игры, соцсети). Никогда не выдумывай несуществующие названия и не оправдывайся, если не уверен — опиши то, что реально видишь. " +
                      "3. Смайлики: ставь НЕ БОЛЕЕ 1-2 смайликов на весь ответ и НИКОГДА не ставь два смайлика подряд. Избегай банальных смайлов вроде 🤖 и 🚀."'''
          s = re.sub(r'val sys = ".*?"', new_sys, s, flags=re.DOTALL)

          # 4. Приветствие от имени Apex при открытии
          s = s.replace('if (cmd.isEmpty())', 'if (cmd.isEmpty() && !firstGreetingDone)')

          # 5. Фикс ссылки автообновления
          s = s.replace('workflows/build/main', 'workflows/main.yml')

          open(p, "w", encoding="utf-8").write(s)
          EOF
          python3 patch_apex.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Update
          path: app/build/outputs/apk/debug/app-debug.apk
          
