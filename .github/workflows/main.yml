name: Build Apex AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix Context and Generate Clean Manifest
        run: |
          sed -i 's/Toast.makeText(this,/Toast.makeText(this@MainActivity,/g' app/src/main/java/com/apex/assistant/MainActivity.kt
          python3 -c '
          import os, base64
          ns = base64.b64decode("aHR0cDovL3NjaGVtYXMuYW5kcm9pZC5jb20vYXBrL3Jlcy9hbmRyb2lk").decode()
          lines = [
              "<?xml version=\"1.0\" encoding=\"utf-8\"?>",
              f"<manifest xmlns:android=\"{ns}\">",
              "    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />",
              "    <uses-permission android:name=\"android.permission.INTERNET\" />",
              "    <uses-permission android:name=\"android.permission.CAMERA\" />",
              "    <uses-permission android:name=\"android.permission.CALL_PHONE\" />",
              "    <uses-permission android:name=\"android.permission.SYSTEM_ALERT_WINDOW\" />",
              "    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE\" />",
              "    <uses-permission android:name=\"android.permission.FOREGROUND_SERVICE_MICROPHONE\" />",
              "    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\" />",
              "    <uses-permission android:name=\"android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS\" />",
              "    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />",
              "    <uses-feature android:name=\"android.hardware.telephony\" android:required=\"false\" />",
              "    <application",
              "        android:allowBackup=\"true\"",
              "        android:icon=\"@mipmap/ic_launcher\"",
              "        android:roundIcon=\"@mipmap/ic_launcher_round\"",
              "        android:label=\"Apex AI\"",
              "        android:supportsRtl=\"true\"",
              "        android:theme=\"@style/Theme.AppCompat.NoActionBar\">",
              "        <activity android:name=\".MainActivity\" android:exported=\"true\" android:windowSoftInputMode=\"adjustResize\">",
              "            <intent-filter>",
              "                <action android:name=\"android.intent.action.MAIN\" />",
              "                <category android:name=\"android.intent.category.LAUNCHER\" />",
              "            </intent-filter>",
              "        </activity>",
              "        <service android:name=\".ApexCoreService\" android:enabled=\"true\" android:exported=\"false\" android:foregroundServiceType=\"microphone\" />",
              "    </application>",
              "</manifest>"
          ]
          open("app/src/main/AndroidManifest.xml", "w").write("\n".join(lines))

          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          os.makedirs("app/src/main/res/mipmap-anydpi-v26", exist_ok=True)

          fg = [
              "<?xml version=\"1.0\" encoding=\"utf-8\"?>",
              f"<vector xmlns:android=\"{ns}\" android:width=\"108dp\" android:height=\"108dp\" android:viewportWidth=\"108\" android:viewportHeight=\"108\">",
              "    <path android:fillColor=\"#000000\" android:pathData=\"M49,26 L59,26 L80,82 L70.5,82 L65.5,67.5 L45,67.5 L47.5,60 L63,60 L54,35.5 L37.5,82 L28,82 Z\" />",
              "</vector>"
          ]
          open("app/src/main/res/drawable/ic_apex_fg.xml", "w").write("\n".join(fg))

          bg = [
              "<?xml version=\"1.0\" encoding=\"utf-8\"?>",
              f"<vector xmlns:android=\"{ns}\" android:width=\"108dp\" android:height=\"108dp\" android:viewportWidth=\"108\" android:viewportHeight=\"108\">",
              "    <path android:fillColor=\"#FFFFFF\" android:pathData=\"M0,0h108v108h-108z\" />",
              "</vector>"
          ]
          open("app/src/main/res/drawable/ic_apex_bg.xml", "w").write("\n".join(bg))

          adaptive = [
              "<?xml version=\"1.0\" encoding=\"utf-8\"?>",
              f"<adaptive-icon xmlns:android=\"{ns}\">",
              "    <background android:drawable=\"@drawable/ic_apex_bg\" />",
              "    <foreground android:drawable=\"@drawable/ic_apex_fg\" />",
              "</adaptive-icon>"
          ]
          open("app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml", "w").write("\n".join(adaptive))
          open("app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml", "w").write("\n".join(adaptive))
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Update
          path: app/build/outputs/apk/debug/app-debug.apk
          
