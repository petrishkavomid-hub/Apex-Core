name: Build Apex AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Patch Script and Build Resources
        run: |
          python3 build_patch.py
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          echo "" | base64 -d > app/src/main/res/drawable/ic_apex_fg.xml
          echo "" | base64 -d > app/src/main/res/drawable/ic_apex_bg.xml
          echo "" | base64 -d > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Update
          path: app/build/outputs/apk/debug/app-debug.apk
          
