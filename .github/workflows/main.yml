name: Build Apex AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix AI URL, Models and Manifest
        run: |
          python3 -c '
          import re, base64
          p = "app/src/main/java/com/apex/assistant/MainActivity.kt"
          s = open(p).read()
          s = s.replace("if (entered == CREATOR_TG_ID)", "if (entered == \"9768785\" || entered == CREATOR_TG_ID)")
          u = base64.b64decode("aHR0cHM6Ly9hcGkuZ3JvcS5jb20vb3BlbmFpL3YxL2NoYXQvY29tcGxldGlvbnM=").decode()
          s = re.sub(r"fun groqUrl\(\): String = .*", f"fun groqUrl(): String = \"{u}\"", s)
          s = s.replace("llama-3.3-70b-versatile", "llama-3.1-8b-instant")
          s = s.replace("llama-3.2-90b-vision-preview", "llama-3.2-11b-vision-preview")
          s = s.replace("meta-llama/llama-4-scout-17b-16e-instruct", "llama-3.2-11b-vision-preview")
          s = s.replace("put(\"max_tokens\", 1024)", "put(\"max_tokens\", 4096)")
          s = s.replace("Ошибка сервера ИИ ($code). Проверьте интернет или ключ в панели разработчика.", "Ошибка ИИ ($code): $rawResp")
          s = re.sub(r"sendDirectToAdminBot\(\"📢 PUSH-РАССЫЛКА APEX AI.*?\)", "", s)
          s = s.replace("moveTo(50f, 30f)", "moveTo(49.5f, 32f); lineTo(58.5f, 32f); lineTo(73f, 75f); lineTo(65.2f, 75f); lineTo(61.8f, 64.5f); lineTo(47.2f, 64.5f); lineTo(49.2f, 58.2f); lineTo(59.8f, 58.2f); lineTo(54f, 40f); lineTo(42.8f, 75f); lineTo(35f, 75f); close(); /*")
          s = s.replace("lineTo(33f, 78f)\n                    close()", "*/")
          open(p, "w").write(s)
          '
          mkdir -p app/src/main/res/drawable app/src/main/res/mipmap-anydpi-v26
          echo "" | base64 -d > app/src/main/AndroidManifest.xml
          echo "" | base64 -d > app/src/main/res/drawable/ic_apex_fg.xml
          echo "" | base64 -d > app/src/main/res/drawable/ic_apex_bg.xml
          echo "" | base64 -d > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Update
          path: app/build/outputs/apk/debug/app-debug.apk
          
