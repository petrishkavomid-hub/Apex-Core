name: Build Apex AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix Android XML namespace
        run: |
          sed -i 's|http://android.com|http://android.com|g' app/src/main/AndroidManifest.xml
          sed -i 's|http://android.com/apk/res/android|http://android.com|g' app/src/main/AndroidManifest.xml
          sed -i 's|http://android.com|http://android.com|g' app/src/main/res/drawable/ic_launcher_apex.xml
          sed -i 's|http://android.com/apk/res/android|http://android.com|g' app/src/main/res/drawable/ic_launcher_apex.xml

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Update
          path: app/build/outputs/apk/debug/app-debug.apk
          
