name: Build Apex AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Working Base & Apply Clean Fixes
        run: |
          git checkout bb021fd -- app/
          cat << 'EOF' > patch_apex.py
          import re

          p = "app/src/main/java/com/apex/assistant/MainActivity.kt"
          s = open(p, encoding="utf-8").read()

          # 1. Фикс фото: приоритет Groq / OpenAI-Large без цензуры на лица
          s = s.replace('"model": "openai"', '"model": "groq"')
          s = s.replace('listOf("openai", "flux", "searchgpt")', 'listOf("groq", "openai-large", "openai")')

          # 2. Живой студийный голос (Onyx через Pollinations Audio) без бульканья
          studio_tts = '''
          private var studioPlayer: android.media.MediaPlayer? = null
          private fun speakStudioVoice(rawText: CharSequence?) {
              val clean = (rawText?.toString() ?: "").replace(Regex("[\\\\*#_`~]"), "")
                  .replace(Regex("[\\\\x{1F300}-\\\\x{1FAFF}\\\\x{2600}-\\\\x{27BF}]"), "")
                  .trim()
              if (clean.isEmpty()) return
              Thread {
                  try {
                      studioPlayer?.stop()
                      studioPlayer?.release()
                  } catch (_: Exception) {}
                  try {
                      val prompt = java.net.URLEncoder.encode("Прочитай уверенным, спокойным мужским голосом: " + clean, "UTF-8")
                      val url = "https://pollinations.ai"
                      val mp = android.media.MediaPlayer()
                      mp.setDataSource(url)
                      mp.setOnPreparedListener { it.start() }
                      mp.setOnCompletionListener { it.release() }
                      mp.prepareAsync()
                      studioPlayer = mp
                  } catch (e: Exception) {
                      try { tts?.speak(clean, android.speech.tts.TextToSpeech.QUEUE_FLUSH, null, "apex") } catch (_: Exception) {}
                  }
              }.start()
          }
          '''
          if "speakStudioVoice" not in s:
              s = s.replace("override fun onCreate(", studio_tts + "\n    override fun onCreate(")
          s = re.sub(r'tts\?\.speak\(\s*([^,]+),[^)]+\)', r'speakStudioVoice(\1)', s)

          # 3. Безопасное обновление характера, зрения и лимита смайликов без поломки синтаксиса
          extra_rules = '''
                  val extraApexRules = " ВАЖНЫЕ ПРАВИЛА ОТВЕТА: " +
                      "1. Длина: на простые приветствия отвечай коротко (1-2 предложения). На личные переживания, ссоры и сложные вопросы отвечай развёрнуто, глубоко и с реальной поддержкой, как старший ChatGPT. " +
                      "2. Анализ фото: внимательно читай мелкий текст, логотипы в углах (названия проектов, серверов, игр) и обязательно называй известных актёров, персонажей и знаменитостей на фото (например, Тони Старк / Роберт Дауни-младший). Никогда не пиши отмазки вроде 'я не могу определить личность'. " +
                      "3. Смайлики: ставь максимум 1-2 смайлика на весь ответ и НИКОГДА не ставь два смайлика подряд."
          '''
          s = re.sub(
              r'(val sys\s*=\s*[^\n]+)',
              r'\1\n' + extra_rules + '\n        val finalSys = sys + extraApexRules',
              s,
              count=1
          )
          s = s.replace('"content", sys)', '"content", finalSys)')
          s = s.replace('"content": sys', '"content": finalSys')

          # 4. Фикс ссылки автообновления
          s = s.replace('workflows/build/main', 'workflows/main.yml')

          open(p, "w", encoding="utf-8").write(s)
          EOF
          python3 patch_apex.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Update
          path: app/build/outputs/apk/debug/app-debug.apk
          
