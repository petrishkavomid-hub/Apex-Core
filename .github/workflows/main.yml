name: Build Apex AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Apex AI Fixes
        run: |
          git checkout bb021fd -- fix_all.py update_code.py final_fix.py
          pip install pillow -q && python3 fix_all.py && python3 update_code.py
          cat << 'PY_SCRIPT_END' > patch_apex.py
          import re
          for fname in ["ApexCoreService.kt", "MainActivity.kt"]:
              fpath = f"app/src/main/java/com/apex/assistant/{fname}"
              txt = open(fpath, encoding="utf-8").read()
              txt = re.sub(r'[a-zA-Z0-9_?.]+\.adjustStreamVolume\([^)]+\)', '// muted_removed', txt)
              txt = re.sub(r'[a-zA-Z0-9_?.]+\.setStreamVolume\([^)]+\)', '// vol_removed', txt)
              txt = txt.replace('workflows/main/main/Apex-AI-Update.zip', 'workflows/build/main/Apex-AI-Update.zip')
              open(fpath, "w", encoding="utf-8").write(txt)
                        p = "app/src/main/java/com/apex/assistant/ApexCoreService.kt"
          s = open(p, encoding="utf-8").read()
          for old_m in ['"openai"', '"openai-fast"', '"gpt-4o-mini"']:
              s = s.replace(f'put("model", {old_m})', 'put("model", "searchgpt")')
              s = s.replace(f'"model": {old_m}', '"model": "searchgpt"')
          s = s.replace('for (m in listOf("openai", "gemini", "openai-fast", "gpt-4o-mini")) {', 'for (m in listOf("gemini", "searchgpt", "openai-large", "openai")) {')
          s = s.replace('if (code in 200..299) {', 'if (code in 200..299 && !raw.contains("credits", true) && !raw.contains("top-up", true) && !raw.contains("не могу определить личность", true) && !raw.contains("cannot identify", true)) {')
          s = re.sub(r'if \(prompt\.isBlank\(\)\) ".*?" else prompt', 'if (prompt.isBlank()) "Внимательно изучи фото: кто или что на нём изображено (актёры, персонажи кино, игр, блогеры, логотипы)? Обязательно назови имя, если узнаваем, и ответь по делу без смайликов." else "$prompt (Внимательно рассмотри фото, прочитай мелкий текст и логотипы, назови имя актёра или персонажа, если узнаваем. Не используй смайлики)."', s)
          s = s.replace('r = r.replace(Regex("[*#_`~>|\\\\[\\\\]]"), "")', 'r = r.replace(Regex("[*#_`~>|\\\\[\\\\]()«»\\"\\\'—–-]"), " ").replace(Regex("[\\\\x{1F300}-\\\\x{1FAFF}\\\\x{2600}-\\\\x{27BF}]"), "")')
          s = s.replace('tts?.setPitch(1.0f)', 'tts?.setPitch(0.85f)')
          new_sys = """val creatorFlag = isCreator || prefs.getBoolean("dev_unlocked", false) || prefs.getBoolean("is_admin", false)
                    val rolePrompt = if (creatorFlag) "ТЫ ОБЩАЕШЬСЯ СО СВОИМ СОЗДАТЕЛЕМ И РАЗРАБОТЧИКОМ — СЕРГЕЕМ (DEREK STEALTH)! Относись к нему как преданный напарник и правая рука: уверенно, по-свойски и с уважением. НИКОГДА не называй его «сэр» — чередуй обращения: «Босс», «Шеф», «Дерек» или «Серёга». У него полный доступ ко всем твоим протоколам." else "Ты общаешься с пользователем как умный, спокойный и надёжный напарник."
                    val sys = "Ты — Apex AI, передовой голосовой ИИ-напарник от Derek Stealth (сейчас ноябрь 2026 года). $rolePrompt $ctxInfo $noGreetRule СТРОГО ЗАПРЕЩЕНО использовать любые смайлики и эмодзи в ответах — пиши чистым текстом. ПРАВИЛА ОТВЕТОВ: 1) Категорически запрещено выдумывать факты, биографии артистов и даты. Например: Kizaru (Кизару) — это российский хип-хоп исполнитель Олег Нечипоренко, основатель Haunted Family (он никогда не был в группе Каста); Miyagi & Эндшпиль — хип-хоп дуэт из Владикавказа (Hajime Records). Если не уверен в факте на 100% — честно скажи, что нужно уточнить, но не фантазируй. 2) На простые приветствия отвечай коротко (1-2 предложения), на сложные и личные вопросы — развёрнуто и по делу. 3) На фото смело узнавай актёров, персонажей кино и игр, а также читай логотипы и названия проектов в углах скриншотов." """
          s = re.sub(r'val sys = ".*?"', new_sys, s, count=1)
          s = s.replace('if (cmd.isEmpty()) { speakClean("Слушаю вас."); return }', 'if (cmd.isEmpty()) { val dev = MainActivity.CREATOR_IDS.contains(Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "") || getSharedPreferences("apex_prefs", Context.MODE_PRIVATE).getBoolean("dev_unlocked", false); speakClean(if (dev) "На связи, Шеф." else "Слушаю вас."); return }')
          open(p, "w", encoding="utf-8").write(s)
          PY_SCRIPT_END
          python3 patch_apex.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Update
          path: app/build/outputs/apk/debug/app-debug.apk
          
