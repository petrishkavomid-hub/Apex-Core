name: Build Apex AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Clean AndroidManifest and Icon
        run: |
          python3 -c '
          ns_android = "http://schemas." + "://android.com"
          ns_tools = "http://schemas." + "://android.com"
          manifest = f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="{ns_android}" xmlns:tools="{ns_tools}">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.telephony" android:required="false" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher_apex"
                  android:roundIcon="@drawable/ic_launcher_apex"
                  android:label="Apex AI"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Material3.DayNight.NoActionBar"
                  tools:replace="android:allowBackup,android:icon,android:roundIcon,android:label,android:theme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".ApexCoreService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>"""
          open("app/src/main/AndroidManifest.xml", "w").write(manifest)

          icon = f"""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="{ns_android}"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#FFFFFF" android:pathData="M0,0h108v108h-108z" />
              <path android:fillColor="#000000" android:pathData="M54,22 L30,86 L38.5,86 L44.3,70 L63.7,70 L69.5,86 L78,86 L54,22 Z M47,62.5 L54,43 L61,62.5 L47,62.5 Z" />
          </vector>"""
          import os
          os.makedirs("app/src/main/res/drawable", exist_ok=True)
          open("app/src/main/res/drawable/ic_launcher_apex.xml", "w").write(icon)
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Update
          path: app/build/outputs/apk/debug/app-debug.apk
          
