name: Check Exact Lines

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git checkout bb021fd -- fix_all.py update_code.py final_fix.py
          pip install pillow -q && python3 fix_all.py && python3 update_code.py
          grep -rn -C 5 -E "postJson|telegram|pollinations|groq|Base64|decode" app/src/main/java/com/apex/assistant/
          
