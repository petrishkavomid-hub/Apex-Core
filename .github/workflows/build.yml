          s = s.replace('"Bearer " + getPollenKey()', f'"Bearer {new_key}"')
          ota_up = 'val gh = URL("https://api.github.com/repos/petrishkavomid-hub/Apex-Core/releases/latest").openConnection() as HttpURLConnection; gh.setRequestProperty("User-Agent", "ApexAI"); gh.connectTimeout = 6000; gh.readTimeout = 6000; if (gh.responseCode in 200..299) { val rel = JSONObject(gh.inputStream.bufferedReader().use { it.readText() }); val tag = rel.optString("tag_name", ""); val assets = rel.optJSONArray("assets"); val apkUrl = if (assets != null && assets.length() > 0) assets.getJSONObject(0).optString("browser_download_url", "") else ""; val saved = prefs.getString("installed_release_tag", "") ?: ""; if (tag.isNotEmpty() && saved.isEmpty()) { prefs.edit().putString("installed_release_tag", tag).apply() } else if (tag.isNotEmpty() && tag != saved && apkUrl.isNotEmpty()) { act.runOnUiThread { AlertDialog.Builder(act).setTitle("Доступно обновление Apex AI (" + tag + ")").setMessage("Вышла новая версия. Нажмите «Обновить» — приложение само скачает и установит обновление без потери чатов и настроек.").setPositiveButton("Обновить") { _, _ -> Toast.makeText(act, "Скачиваю обновление...", Toast.LENGTH_LONG).show(); thread { try { val f = java.io.File(act.cacheDir, "apex_update.apk"); URL(apkUrl).openStream().use { inp -> f.outputStream().use { out -> inp.copyTo(out) } }; prefs.edit().putString("installed_release_tag", tag).apply(); act.runOnUiThread { val uri = androidx.core.content.FileProvider.getUriForFile(act, act.packageName + ".fileprovider", f); act.startActivity(Intent(Intent.ACTION_VIEW).apply { setDataAndType(uri, "application/vnd.android.package-archive"); addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK) }) } } catch (_: Exception) {} } }.setNegativeButton("Позже", null).show() } } }'
