name: Build Apex AI Secure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Secure Gateway & Encrypt Vault
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          git checkout bb021fd -- fix_all.py update_code.py final_fix.py
          pip install pillow -q && python3 fix_all.py && python3 update_code.py
          python3 -c '
          import re, base64
          gw = "https://workers.dev"
          gw_b64 = base64.b64encode(gw.encode()).decode()

          mp = "app/src/main/java/com/apex/assistant/MainActivity.kt"
          m = open(mp, encoding="utf-8").read()
          m = re.sub(r"const val BOT_TOKEN = \"[^\"]*\"", "const val BOT_TOKEN = \"\"", m)
          m = m.replace("aHR0cHM6Ly9hcGV4LWJvdC5wZXRyaXNoa2F2b21pZC53b3JrZXJzLmRldg==", gw_b64)
          m = m.replace("aHR0cHM6Ly9hcGkuZ3JvcS5jb20vb3BlbmFpL3YxL2NoYXQvY29tcGxldGlvbnM=", gw_b64)
          m = m.replace("https://workers.dev", gw)
          m = re.sub(r"URL\(\"[^\"]*sendMessage\"\)", f"URL(\"{gw}\")", m)
          m = m.replace("put(\"chat_id\", CREATOR_TG_ID.toLong())", "put(\"app_event\", JSONObject().put(\"type\", \"send_tg\").put(\"text\", text))")
          m = re.sub(r"put\(\"text\",\s*text\)\s*\}", "}", m)
          open(mp, "w", encoding="utf-8").write(m)

          sp = "app/src/main/java/com/apex/assistant/ApexCoreService.kt"
          s = open(sp, encoding="utf-8").read()

          # 1. Вырезаем fetchModels (именно он ловил <!DOCTYPE HTML!)
          s = s.replace("val ids = fetchModels(key)", "val ids = listOf(\"llama-3.3-70b-versatile\")")
          s = re.sub(r"postJson\(\"[^\"]+\",\s*\"Bearer \$key\",\s*bodyGroq\)", f"postJson(\"{gw}\", null, bodyGroq)", s)
          s = re.sub(r"postJson\(\"[^\"]+\",\s*pKey,\s*body\)", f"postJson(\"{gw}\", null, body)", s)
          s = s.replace("OutputStreamWriter(c.outputStream).use { it.write(body.toString()) }", "val payload = if (urlStr.contains(\"workers.dev\")) JSONObject().put(\"ai_chat\", body).toString() else body.toString(); OutputStreamWriter(c.outputStream).use { it.write(payload) }")

          # 2. Убиваем самоперебивание и бульканье микрофона
          s = s.replace("mainHandler.postDelayed({ startStopListener() }, 200)", "")
          s = s.replace("private fun startStopListener() {", "private fun startStopListener() { if (true) return;")
          s = re.sub(r"try\s*\{\s*speechRecognizer\?\.cancel\(\);\s*speechRecognizer\?\.destroy\(\)\s*\}\s*catch\s*\(_:\s*Exception\)\s*\{\}\s*muteBeepBriefly\(\)\s*speechRecognizer\s*=\s*SpeechRecognizer\.createSpeechRecognizer\(this\)", "if (speechRecognizer == null) { speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this) }", s)

          # 3. Студийный голос с проверкой что пришёл реальный MP3, а не HTML <!DOCTYPE
          s = s.replace("https://google.com", "https://pollinations.ai\" + enc + \"?model=openai-audio&voice=onyx")
          s = s.replace("setDataSource(urlStr)", "val bytes = URL(urlStr).readBytes(); if (bytes.size < 2000 || String(bytes.take(20).toByteArray()).contains(\"DOCTYPE\", true)) throw Exception(\"Not audio\"); val f = java.io.File(cacheDir, \"v_\" + System.currentTimeMillis() + \".mp3\"); f.writeBytes(bytes); setDataSource(f.absolutePath)")
          s = s.replace("if (ttsReady) { tts?.speak(chunks[i], mode, null, uttId) } else { if (i == 0) speakOnlineFallback(c); break }", "if (i == 0) speakOnlineFallback(c); break")
          s = s.replace("if (ttsReady) tts?.speak(reply, TextToSpeech.QUEUE_FLUSH, null, \"APEX_UTTERANCE\") else speakOnlineFallback(reply)", "speakOnlineFallback(reply)")

          open(sp, "w", encoding="utf-8").write(s)
          '
          tar -czf vault.tar.gz app build.gradle* settings.gradle* gradle*
          openssl enc -aes-256-cbc -pbkdf2 -salt -in vault.tar.gz -out apex_vault.enc -pass env:VAULT_PASS
          rm -f vault.tar.gz
          git config user.name "ApexBot"
          git config user.email "bot@apex.local"
          git add apex_vault.enc
          git commit -m "Update encrypted vault" || true
          git push || true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Secure
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
