                            private fun View.applySpring() {
                  setOnTouchListener { v, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> v.animate().scaleX(0.92f).scaleY(0.92f).setDuration(90).start()
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> v.animate().scaleX(1f).scaleY(1f).setDuration(140).start()
                      }
                      false
                  }
              }

              private fun View.animateEnter() {
                  alpha = 0f
                  translationY = dp(16).toFloat()
                  scaleX = 0.96f
                  scaleY = 0.96f
                  animate().alpha(1f).translationY(0f).scaleX(1f).scaleY(1f)
                      .setDuration(240).setInterpolator(DecelerateInterpolator()).start()
              }

              private fun startNewChat() {
                  currentChatId = UUID.randomUUID().toString()
                  messages.clear()
                  chatBox.removeAllViews()
                  chatScroll.visibility = View.GONE
                  centerHero.alpha = 0f
                  centerHero.visibility = View.VISIBLE
                  centerHero.animate().alpha(1f).setDuration(250).start()
                  heroGreeting.text = greetings.random()
                  stopSpeech()
              }

              private fun sendMessage(voiceText: String? = null) {
                  val txt = (voiceText ?: input.text.toString()).trim()
                  val img = pendingImageB64
                  if (txt.isEmpty() && img == null) return

                  val savedUser = getSharedPreferences("apex_prefs", Context.MODE_PRIVATE).getString("tg_user", "") ?: ""
                  if (savedUser.isBlank()) {
                      showSubscriptionGate(isUnsubscribed = false)
                      return
                  }

                  if (voiceText == null) input.setText("")
                  pendingImageB64 = null
                  photoChip.visibility = View.GONE

                  if (centerHero.visibility == View.VISIBLE) {
                      centerHero.animate().alpha(0f).setDuration(180).withEndAction {
                          centerHero.visibility = View.GONE
                          chatScroll.visibility = View.VISIBLE
                      }.start()
                  }

                  val userDisplay = if (img != null) "[Фото] $txt".trim() else txt
                  addUserBubble(userDisplay)
                  messages.add("user" to txt.ifBlank { "Опиши фото" })
                  saveCurrentChat()

                  val thinking = addThinkingBubble()
                  val snap = messages.toList()
                  thread {
                      val (subOk, _) = ApexEngine.checkSubscription(savedUser)
                      if (!subOk) {
                          runOnUiThread {
                              chatBox.removeView(thinking)
                              showSubscriptionGate(isUnsubscribed = true)
                          }
                          return@thread
                      }
                      val local = if (img == null) ApexEngine.runLocalCommand(this, txt) else null
                      if (local != null) {
                          runOnUiThread {
                              chatBox.removeView(thinking)
                              messages.add("assistant" to local)
                              addBotBubble(local)
                              saveCurrentChat()
                              if (voiceText != null || autoSpeak) speakClean(local, null)
                          }
                          return@thread
                      }
                      val reply = ApexEngine.askAi(snap, img)
                      runOnUiThread {
                          chatBox.removeView(thinking)
                          messages.add("assistant" to reply)
                          addBotBubble(reply)
                          saveCurrentChat()
                          if (voiceText != null || autoSpeak) speakClean(reply, null)
                      }
                  }
              }

              private fun addThinkingBubble(): LinearLayout {
                  val wrap = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(16), dp(12), dp(16), dp(12))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#0D1322"))
                          cornerRadius = dp(18).toFloat()
                          setStroke(1, Color.parseColor("#1E3A8A"))
                      }
                      layoutParams = LinearLayout.LayoutParams(-2, -2).apply { setMargins(0, dp(6), 0, dp(6)) }
                  }
                  val dots = listOf("●", "●", "●")
                  dots.forEachIndexed { idx, s ->
                      val d = TextView(this).apply {
                          text = s
                          setTextColor(Color.parseColor("#38BDF8"))
                          textSize = 11f
                          setPadding(dp(3), 0, dp(3), 0)
                      }
                      ValueAnimator.ofFloat(0.25f, 1f).apply {
                          duration = 550
                          startDelay = (idx * 160).toLong()
                          repeatMode = ValueAnimator.REVERSE
                          repeatCount = ValueAnimator.INFINITE
                          addUpdateListener { d.alpha = it.animatedValue as Float }
                          start()
                      }
                      wrap.addView(d)
                  }
                  val lbl = TextView(this).apply {
                      text = "  Apex формирует ответ"
                      setTextColor(Color.parseColor("#94A3B8"))
                      textSize = 13f
                  }
                  wrap.addView(lbl)
                  chatBox.addView(wrap)
                  wrap.animateEnter()
                  chatScroll.post { chatScroll.fullScroll(ScrollView.FOCUS_DOWN) }
                  return wrap
              }
                            private fun addUserBubble(text: String) {
