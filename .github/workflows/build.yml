          L.append('    private fun addMessage(text: String, isUser: Boolean) { welcomeLayout.visibility = View.GONE; val d = resources.displayMetrics.density; val row = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding((14 * d).toInt(), (11 * d).toInt(), (14 * d).toInt(), (11 * d).toInt()); background = GradientDrawable().apply { setColor(Color.parseColor(if (isUser) "#131C2E" else "#0D121D")); cornerRadius = 18 * d; setStroke((1f * d).toInt(), Color.parseColor(if (isUser) "#1D4ED8" else "#1E293B")) }; layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = (10 * d).toInt() } }; row.addView(TextView(this).apply { this.text = if (isUser) "Вы" else "APEX"; setTextColor(Color.parseColor(if (isUser) "#60A5FA" else "#38BDF8")); textSize = 11f; typeface = Typeface.DEFAULT_BOLD }); row.addView(TextView(this).apply { this.text = text; setTextColor(Color.parseColor("#F1F5F9")); textSize = 14.5f; setPadding(0, (4 * d).toInt(), 0, 0); setTextIsSelectable(true) }); if (!isUser) { val actions = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL; setPadding(0, (8 * d).toInt(), 0, 0) }; actions.addView(TextView(this).apply { this.text = "Скопировать"; setTextColor(Color.parseColor("#64748B")); textSize = 11.5f; setPadding(0, 0, (18 * d).toInt(), 0); setOnClickListener { (getSystemService(CLIPBOARD_SERVICE) as ClipboardManager).setPrimaryClip(ClipData.newPlainText("Apex", text)); Toast.makeText(this@MainActivity, "Скопировано", Toast.LENGTH_SHORT).show() } }); actions.addView(TextView(this).apply { this.text = "Озвучить"; setTextColor(Color.parseColor("#38BDF8")); textSize = 11.5f; setOnClickListener { startService(Intent(this@MainActivity, ApexCoreService::class.java).apply { action = "SPEAK_TEXT"; putExtra("text", text) }) } }); row.addView(actions) }; messagesContainer.addView(row); row.alpha = 0f; row.translationY = 24f * d; row.animate().alpha(1f).translationY(0f).setDuration(240L).start(); chatScroll.post { chatScroll.fullScroll(View.FOCUS_DOWN) } }')
          L.append('    private fun startNewChat() { messagesContainer.removeAllViews(); welcomeLayout.visibility = View.VISIBLE; attachedB64 = null }')
          L.append('    private fun pickImage() { startActivityForResult(Intent(Intent.ACTION_PICK, MediaStore.Images.Media.EXTERNAL_CONTENT_URI), 101) }')
          L.append('    override fun onActivityResult(req: Int, res: Int, data: Intent?) { super.onActivityResult(req, res, data); if (req == 101 && res == RESULT_OK && data?.data != null) { try { val bmp = MediaStore.Images.Media.getBitmap(contentResolver, data.data); val sc = Bitmap.createScaledBitmap(bmp, 768, (bmp.height * (768f / bmp.width)).toInt().coerceAtLeast(1), true); val out = ByteArrayOutputStream(); sc.compress(Bitmap.CompressFormat.JPEG, 78, out); attachedB64 = Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP); Toast.makeText(this, "Фото готово к отправке", Toast.LENGTH_SHORT).show() } catch (_: Exception) {} } }')
          L.append('    private fun showRateDialog() { val stars = arrayOf("★ 1", "★★ 2", "★★★ 3", "★★★★ 4", "★★★★★ 5"); AlertDialog.Builder(this).setTitle("Оценить Apex AI").setItems(stars) { _, w -> Toast.makeText(this, "Спасибо за оценку " + stars[w], Toast.LENGTH_SHORT).show() }.show() }')
          
          L.append('    private fun showAboutDialog() { AlertDialog.Builder(this).setTitle("Apex AI Core").setMessage("Интеллектуальный голосовой и мультимодальный ассистент нового поколения.").setPositiveButton("Закрыть", null).show() }')
          L.append('    private fun requestPerms() { val p = arrayOf(Manifest.permission.RECORD_AUDIO); if (p.any { ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED }) ActivityCompat.requestPermissions(this, p, 1) }')
          L.append('    private fun checkOtaUpdate() { thread { try { val c = URL("https://api.github.com/repos/petrishkavomid-hub/Apex-Core/releases/latest").openConnection() as HttpURLConnection; c.setRequestProperty("User-Agent", "ApexAI"); if (c.responseCode in 200..299) { val rel = JSONObject(c.inputStream.bufferedReader().use { it.readText() }); val tag = rel.optString("tag_name", ""); val url = rel.optJSONArray("assets")?.optJSONObject(0)?.optString("browser_download_url", "") ?: ""; val saved = prefs.getString("installed_release_tag", "") ?: ""; if (tag.isNotEmpty() && saved.isEmpty()) prefs.edit().putString("installed_release_tag", tag).apply() else if (tag.isNotEmpty() && tag != saved && url.isNotEmpty()) runOnUiThread { AlertDialog.Builder(this).setTitle("Доступно обновление (" + tag + ")").setMessage("Обновить приложение без потери данных?").setPositiveButton("Обновить") { _, _ -> thread { try { val f = java.io.File(cacheDir, "upd.apk"); URL(url).openStream().use { inp -> f.outputStream().use { out -> inp.copyTo(out) } }; prefs.edit().putString("installed_release_tag", tag).apply(); runOnUiThread { val uri = androidx.core.content.FileProvider.getUriForFile(this, packageName + ".fileprovider", f); startActivity(Intent(Intent.ACTION_VIEW).apply { setDataAndType(uri, "application/vnd.android.package-archive"); addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION or Intent.FLAG_ACTIVITY_NEW_TASK) }) } } catch (_: Exception) {} } }.setNegativeButton("Позже", null).show() } } } catch (_: Exception) {} } }')
