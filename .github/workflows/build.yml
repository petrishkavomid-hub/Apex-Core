name: Build Apex AI Secure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Secure Gateway & Encrypt Vault
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          git checkout bb021fd -- fix_all.py update_code.py final_fix.py
          pip install pillow -q && python3 fix_all.py && python3 update_code.py
          python3 -c '
          import re, base64
          gw = "https://workers.dev"
          gw_b64 = base64.b64encode(gw.encode()).decode()

          mp = "app/src/main/java/com/apex/assistant/MainActivity.kt"
          m = open(mp, encoding="utf-8").read()
          m = re.sub(r"const val BOT_TOKEN = \"[^\"]*\"", "const val BOT_TOKEN = \"\"", m)
          m = m.replace("aHR0cHM6Ly9hcGV4LWJvdC5wZXRyaXNoa2F2b21pZC53b3JrZXJzLmRldg==", gw_b64).replace("aHR0cHM6Ly9hcGkuZ3JvcS5jb20vb3BlbmFpL3YxL2NoYXQvY29tcGxldGlvbnM=", gw_b64).replace("https://workers.dev", gw)
          m = m.replace("URL(\"${tgApiHost()}/bot$BOT_TOKEN/sendMessage\")", f"URL(\"{gw}\")").replace("put(\"chat_id\", CREATOR_TG_ID.toLong())", "put(\"app_event\", JSONObject().put(\"type\", \"send_tg\").put(\"text\", text))").replace("put(\"text\", text)\n                    }", "}")
          open(mp, "w", encoding="utf-8").write(m)

          sp = "app/src/main/java/com/apex/assistant/ApexCoreService.kt"
          s = open(sp, encoding="utf-8").read()
          s = s.replace("aHR0cHM6Ly9hcGkuZ3JvcS5jb20vb3BlbmFpL3YxL2NoYXQvY29tcGxldGlvbnM=", gw_b64).replace("https://groq.com", gw).replace("https://pollinations.ai", gw)
          s = re.sub(r"private fun getPollenKey\(\) = .*", "private fun getPollenKey() = \"worker_proxy\"", s).replace("listOf(\"gemini\", \"openai\", \"openai-fast\")", "listOf(\"meta-llama/llama-4-scout-17b-16e-instruct\")")

          s = s.replace("OutputStreamWriter(c.outputStream).use { it.write(body.toString()) }", "val payload = if (urlStr.contains(\"workers.dev\")) JSONObject().put(\"ai_chat\", body).toString() else body.toString(); OutputStreamWriter(c.outputStream).use { it.write(payload) }")

          neural = "private var neuralPlayer: android.media.MediaPlayer? = null\n    private fun speakClean(text: String) { val c = cleanSpeech(text); if (c.isEmpty()) { isSpeaking = false; if (isListeningActive) startListeningCycle(); return }; isSpeaking = true; mainHandler.post { try { speechRecognizer?.cancel() } catch (_: Exception) {}; thread { try { val conn = URL(\"https://pollinations.ai\" + Uri.encode(c.take(600)) + \"?model=openai-audio&voice=onyx\").openConnection() as HttpURLConnection; conn.connectTimeout = 5000; conn.readTimeout = 9000; if (conn.responseCode in 200..299) { val b = conn.inputStream.readBytes(); if (b.size > 1000) { val f = java.io.File(cacheDir, \"tts_\" + System.currentTimeMillis() + \".mp3\"); f.writeBytes(b); mainHandler.post { try { neuralPlayer?.release(); neuralPlayer = android.media.MediaPlayer().apply { setDataSource(f.absolutePath); setOnCompletionListener { it.release(); f.delete(); isSpeaking = false; if (isListeningActive) mainHandler.postDelayed({ startListeningCycle() }, 450L) }; prepare(); start() } } catch (_: Exception) { isSpeaking = false } }; return@thread } } } catch (_: Exception) {}; mainHandler.post { speakSystemFallback(c) } } } }\n    private fun speakSystemFallback(text: String) {"
          s = s.replace("private fun speakClean(text: String) {", neural)
          s = s.replace("try { speechRecognizer?.cancel(); speechRecognizer?.destroy() } catch (_: Exception) {}\n                muteBeepBriefly()\n                speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)", "if (speechRecognizer == null) { speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this) }")
          s = s.replace("mainHandler.postDelayed({ startListeningCycle() }, 1500L)", "if (e == SpeechRecognizer.ERROR_CLIENT || e == SpeechRecognizer.ERROR_RECOGNIZER_BUSY) { try { speechRecognizer?.destroy() } catch (_: Exception) {}; speechRecognizer = null }; mainHandler.postDelayed({ startListeningCycle() }, 600L)")
          open(sp, "w", encoding="utf-8").write(s)
          '
          tar -czf vault.tar.gz app build.gradle* settings.gradle* gradle*
          openssl enc -aes-256-cbc -pbkdf2 -salt -in vault.tar.gz -out apex_vault.enc -pass env:VAULT_PASS
          rm -f vault.tar.gz
          git config user.name "ApexBot"
          git config user.email "bot@apex.local"
          git add apex_vault.enc
          git commit -m "Update encrypted vault" || true
          git push || true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Secure
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
