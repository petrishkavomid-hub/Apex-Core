name: Build Apex AI Secure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Secure Gateway & Encrypt Vault
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          git checkout bb021fd -- fix_all.py update_code.py final_fix.py
          sed -i 's/^ c2 =/c2 =/; s/^ c3 =/c3 =/' final_fix.py
          pip install pillow -q && python3 final_fix.py && python3 update_code.py
          cat << 'EOF' > patch_final.py
          import re, base64, os
          gw = "https://" + "purple-butterfly-e9ca." + "ildqnangel." + "workers.dev"
          gw_b64 = base64.b64encode(gw.encode()).decode()
          new_key = "gsk_" + "7crDRsbMxuxitQFx41MTWGdyb3FYho1GHzm7F1stz06ZobPZdUxv"
          man_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(man_path):
              man = open(man_path, encoding="utf-8").read()
              if "QUERY_ALL_PACKAGES" not in man:
                  man = man.replace("<application", "<uses-permission android:name=\"android.permission.QUERY_ALL_PACKAGES\" />\n    <application", 1)
                  open(man_path, "w", encoding="utf-8").write(man)
          mp = "app/src/main/java/com/apex/assistant/MainActivity.kt"
          m = open(mp, encoding="utf-8").read()
          m = re.sub(r"const val BOT_TOKEN = \"[^\"]*\"", "const val BOT_TOKEN = \"\"", m)
          m = re.sub(r"return \"gsk_[^\"]+\"", f"return \"{new_key}\"", m)
          m = m.replace("aHR0cHM6Ly9hcGV4LWJvdC5wZXRyaXNoa2F2b21pZC53b3JrZXJzLmRldg==", gw_b64).replace("https://workers.dev", gw)
          m = m.replace("URL(\"${tgApiHost()}/bot$BOT_TOKEN/sendMessage\")", f"URL(\"{gw}\")")
          m = m.replace("put(\"chat_id\", CREATOR_TG_ID.toLong())", "put(\"app_event\", JSONObject().put(\"type\", \"send_tg\").put(\"text\", text))")
          m = m.replace("                put(\"text\", text)\n", "")
          m = m.replace("textSize = 44f", "textSize = 58f").replace("cornerRadius = 36f", "cornerRadius = 56f")
          m = m.replace("text = \"+\"", "text = \"+\"; includeFontPadding = false; setPadding(0, 0, 0, 0); gravity = Gravity.CENTER; textSize = 22f; setTextColor(Color.parseColor(\"#38BDF8\")); background = GradientDrawable().apply { setColor(Color.parseColor(\"#1E293B\")); cornerRadius = 999f; setStroke(2, Color.parseColor(\"#38BDF8\")) }")
          m = m.replace("text = \"↑\"", "text = \"↑\"; includeFontPadding = false; setPadding(0, 0, 0, 0); gravity = Gravity.CENTER; textSize = 20f; setTextColor(Color.WHITE); background = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(Color.parseColor(\"#6366F1\"), Color.parseColor(\"#06B6D4\"))).apply { cornerRadius = 999f }")
          m = m.replace("text = \"↻\"", "text = \"↻\"; includeFontPadding = false; setPadding(0, 0, 0, 0); gravity = Gravity.CENTER; textSize = 19f; setTextColor(Color.parseColor(\"#38BDF8\")); background = GradientDrawable().apply { setColor(Color.parseColor(\"#14141A\")); cornerRadius = 999f; setStroke(2, Color.parseColor(\"#27272F\")) }")
          m = m.replace("text = \"=\"", "text = \"≡\"; includeFontPadding = false; setPadding(0, 0, 0, 0); gravity = Gravity.CENTER; textSize = 21f; setTextColor(Color.WHITE); background = GradientDrawable().apply { setColor(Color.parseColor(\"#14141A\")); cornerRadius = 999f; setStroke(2, Color.parseColor(\"#27272F\")) }")
          p1 = 'elevation = 20f\n            val badgeRef = this\n            android.animation.ObjectAnimator.ofPropertyValuesHolder(this, android.animation.PropertyValuesHolder.ofFloat("scaleX", 1f, 1.09f, 1f), android.animation.PropertyValuesHolder.ofFloat("scaleY", 1f, 1.09f, 1f), android.animation.PropertyValuesHolder.ofFloat("rotation", -2f, 2f, -2f)).apply { duration = 2600; repeatCount = android.animation.ValueAnimator.INFINITE; interpolator = android.view.animation.AccelerateDecelerateInterpolator(); start() }\n            postDelayed({\n                val root = window.decorView as? android.view.ViewGroup ?: return@postDelayed\n                if (root.findViewWithTag<android.view.View>("APEX_AMBIENT_FX") != null) return@postDelayed\n                val density = resources.displayMetrics.density\n                fun findEt(v: android.view.View?): android.widget.EditText? { if (v is android.widget.EditText) return v; if (v is android.view.ViewGroup) { for (i in 0 until v.childCount) { val r = findEt(v.getChildAt(i)); if (r != null) return r } }; return null }\n                val etRef = findEt(root)\n                (etRef?.parent as? android.view.ViewGroup)?.let { bar -> bar.setPadding((10 * density).toInt(), (8 * density).toInt(), (10 * density).toInt(), (8 * density).toInt()); bar.background = GradientDrawable().apply { setColor(Color.parseColor("#13131A")); cornerRadius = 30 * density; setStroke((1.5f * density).toInt(), Color.parseColor("#3338BDF8")) }; (bar.parent as? android.view.ViewGroup)?.setPadding((14 * density).toInt(), (8 * density).toInt(), (14 * density).toInt(), (28 * density).toInt()) }\n                val topBox = LinearLayout(this@MainActivity).apply { tag = "APEX_TOP_PILLS"; orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER_HORIZONTAL; setPadding((16 * density).toInt(), (86 * density).toInt(), (16 * density).toInt(), 0) }\n                fun makePill(label: String, strokeHex: String, onClick: () -> Unit): TextView = TextView(this@MainActivity).apply { text = label; setTextColor(Color.WHITE); textSize = 13.5f; typeface = android.graphics.Typeface.DEFAULT_BOLD; gravity = Gravity.CENTER; setPadding((22 * density).toInt(), (11 * density).toInt(), (22 * density).toInt(), (11 * density).toInt()); background = GradientDrawable().apply { setColor(Color.parseColor("#7716161E")); cornerRadius = 26 * density; setStroke((1.5f * density).toInt(), Color.parseColor(strokeHex)) }; layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.WRAP_CONTENT, LinearLayout.LayoutParams.WRAP_CONTENT).apply { bottomMargin = (10 * density).toInt() }; setOnClickListener { animate().scaleX(0.94f).scaleY(0.94f).setDuration(90).withEndAction { animate().scaleX(1f).scaleY(1f).setDuration(120).start(); onClick() }.start() } }\n                val b1 = makePill("Включить голосовой режим", "#38BDF8") { val si = Intent(this@MainActivity, ApexCoreService::class.java).apply { action = "START_VOICE" }; if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) startForegroundService(si) else startService(si); Toast.makeText(this@MainActivity, "Голосовой режим включён", Toast.LENGTH_SHORT).show() }\n                val b2 = makePill("Выключить микрофон", "#F43F5E") { startService(Intent(this@MainActivity, ApexCoreService::class.java).apply { action = "STOP_VOICE" }); Toast.makeText(this@MainActivity, "Микрофон выключен", Toast.LENGTH_SHORT).show() }\n                val b3 = makePill("Наш Telegram канал", "#8B5CF6") { try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://t.me/Apexassistantcore"))) } catch (_: Exception) {} }\n                topBox.addView(b1); topBox.addView(b2); topBox.addView(b3)\n                root.addView(topBox, android.widget.FrameLayout.LayoutParams(android.widget.FrameLayout.LayoutParams.MATCH_PARENT, android.widget.FrameLayout.LayoutParams.WRAP_CONTENT))\n                listOf(b1, b2, b3).forEachIndexed { idx, v -> android.animation.ObjectAnimator.ofFloat(v, "translationX", -14f, 14f, -14f).apply { duration = 3200L + idx * 450L; repeatCount = android.animation.ValueAnimator.INFINITE; interpolator = android.view.animation.AccelerateDecelerateInterpolator(); start() } }\n                val swapHandler = Handler(Looper.getMainLooper())\n                swapHandler.postDelayed(object : Runnable { override fun run() { if (topBox.parent != null && topBox.visibility == android.view.View.VISIBLE && topBox.childCount == 3) { val first = topBox.getChildAt(0); topBox.animate().alpha(0.35f).setDuration(220).withEndAction { topBox.removeViewAt(0); topBox.addView(first); topBox.animate().alpha(1f).setDuration(260).start() }.start(); swapHandler.postDelayed(this, 4500L) } } }, 4500L)\n'
          p2 = '                var pPhase = 0f\n                val stageView = object : android.view.View(this@MainActivity) { val pOrb = Paint(Paint.ANTI_ALIAS_FLAG); val pRing = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#6366F1"); style = Paint.Style.STROKE; strokeWidth = 4f }; val pRing2 = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#06B6D4"); style = Paint.Style.STROKE; strokeWidth = 2.5f }; val pBubble = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#18181B"); style = Paint.Style.FILL }; val pStroke = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#38BDF8"); style = Paint.Style.STROKE; strokeWidth = 3f }; val pEye = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#38BDF8") }; val cols = intArrayOf(Color.parseColor("#8B5CF6"), Color.parseColor("#06B6D4"), Color.parseColor("#3B82F6"), Color.parseColor("#EC4899"), Color.parseColor("#10B981"), Color.parseColor("#6366F1"), Color.parseColor("#F59E0B")); override fun onDraw(c: Canvas) { val loc = IntArray(2); badgeRef.getLocationOnScreen(loc); val inLoc = IntArray(2); etRef?.getLocationOnScreen(inLoc); if (loc.first() <= 0 && loc.last() <= 0) return; val cx = loc.first() + badgeRef.width / 2f; val cy = loc.last() + badgeRef.height / 2f; pRing.alpha = 185; pRing2.alpha = 120; c.drawCircle(cx, cy, 105f + Math.sin(pPhase * 2.0).toFloat() * 10f, pRing); c.drawCircle(cx, cy, 134f - Math.sin(pPhase * 2.0).toFloat() * 8f, pRing2); for (i in 0 until 7) { val ang = Math.toRadians(190.0 + i * 26.0 + Math.sin(pPhase + i * 0.4) * 16.0); val dist = 172f + Math.sin(pPhase * 1.5 + i).toFloat() * 15f; val ox = cx + Math.cos(ang).toFloat() * dist; val oy = cy + Math.sin(ang).toFloat() * dist; pOrb.color = cols[i]; pOrb.alpha = 240; c.drawCircle(ox, oy, 16f + (i % 2) * 5f, pOrb) }; val by = cy + 195f + Math.sin(pPhase * 1.8).toFloat() * 8f; if (inLoc.last() <= 0 || by + 75f < inLoc.last()) { pBubble.alpha = 238; pStroke.alpha = 255; pEye.alpha = 255; c.drawCircle(cx - 85f, by - 45f, 18f, pBubble); c.drawCircle(cx - 85f, by - 45f, 18f, pStroke); c.drawRoundRect(cx - 65f, by - 35f, cx + 105f, by + 65f, 48f, 48f, pBubble); c.drawRoundRect(cx - 65f, by - 35f, cx + 105f, by + 65f, 48f, 48f, pStroke); val eyeShift = Math.sin(pPhase * 1.4).toFloat() * 11f; val mod = pPhase % 6.28f; val blink = if ((mod > 2.4f && mod < 2.75f) || (mod > 4.6f && mod < 4.9f)) 3f else 18f; c.drawRoundRect(cx - 22f + eyeShift, by + 15f - blink, cx + 2f + eyeShift, by + 15f + blink, 8f, 8f, pEye); c.drawRoundRect(cx + 38f + eyeShift, by + 15f - blink, cx + 62f + eyeShift, by + 15f + blink, 8f, 8f, pEye) } } }\n                stageView.tag = "APEX_AMBIENT_FX"\n                root.addView(stageView, 1)\n                android.animation.ValueAnimator.ofFloat(0f, 628.318f).apply { duration = 400000L; repeatCount = android.animation.ValueAnimator.INFINITE; interpolator = android.view.animation.LinearInterpolator(); addUpdateListener { if (messagesContainer.childCount > 0) { stageView.visibility = android.view.View.GONE; topBox.visibility = android.view.View.GONE } else { stageView.visibility = android.view.View.VISIBLE; val lNow = IntArray(2); badgeRef.getLocationOnScreen(lNow); topBox.visibility = if (lNow.last() < 380) android.view.View.GONE else android.view.View.VISIBLE; pPhase = it.animatedValue as Float; stageView.invalidate() } }; start() }\n            }, 350L)'
          m = m.replace("elevation = 8f", p1 + p2, 1)
          m = m.replace("arrayOf(\"Думаю •  \", \"Думаю  • \", \"Думаю   •\", \"Думаю •••\")", "arrayOf(\"Апекс думает  ● ○ ○\", \"Апекс думает  ○ ● ○\", \"Апекс думает  ○ ○ ●\", \"Апекс думает  ● ● ●\")")
          m = m.replace("hAnim.postDelayed(this, 300)", "hAnim.postDelayed(this, 220)")
          msg_anim = "messagesContainer.addView(row); row.alpha = 0f; row.translationY = 48f; row.scaleX = 0.96f; row.scaleY = 0.96f; row.animate().alpha(1f).translationY(0f).scaleX(1f).scaleY(1f).setDuration(300).setInterpolator(android.view.animation.DecelerateInterpolator()).start(); (window.decorView as? android.view.ViewGroup)?.let { r -> r.findViewWithTag<android.view.View>(\"APEX_AMBIENT_FX\")?.visibility = android.view.View.GONE; r.findViewWithTag<android.view.View>(\"APEX_TOP_PILLS\")?.visibility = android.view.View.GONE }"
          m = m.replace("messagesContainer.addView(row)", msg_anim, 1)
          m = m.replace("drawerLayout.openDrawer(Gravity.START)", "drawerLayout.openDrawer(Gravity.START); drawerLayout.getChildAt(1)?.let { p -> p.alpha = 0f; p.translationX = -60f; p.animate().alpha(1f).translationX(0f).setDuration(320).setInterpolator(android.view.animation.DecelerateInterpolator()).start() }")
          open(mp, "w", encoding="utf-8").write(m)
          sp = "app/src/main/java/com/apex/assistant/ApexCoreService.kt"
          s = open(sp, encoding="utf-8").read()
          s = s.replace("private var ttsReady = false", "", 1)
          s = s.replace("Джарвис на связи", "Apex AI на связи")
          s = s.replace("Bearer " + chr(36) + "key", f"Bearer {new_key}")
          s = s.replace("return t.replace(Regex(\"[*#_`~>|\\\\\\\\[\\\\\\\\]]\"), \"\")", "return t.replace(Regex(\"[^а-яА-ЯёЁa-zA-Z0-9\\\\s]\"), \" \")")
          s = s.replace("tts?.setPitch(0.92f)", "tts?.setPitch(0.84f)")
          s = s.replace("tts?.setSpeechRate(1.12f)", "tts?.setSpeechRate(1.04f)")
          s = s.replace("tts?.speak(c, TextToSpeech.QUEUE_FLUSH, b, \"APEX_LAST\")", "tts?.speak(c, TextToSpeech.QUEUE_FLUSH, null, \"APEX_LAST\")")
          s = s.replace("val wake = listOf(\"апекс\", \"апэкс\", \"апикс\", \"эпекс\", \"алекс\", \"apex\")", "val wake = listOf(\"апекс\", \"апэкс\", \"апикс\", \"эпекс\", \"алекс\", \"а пекс\", \"апекса\", \"апексу\", \"apex\")")
          s = s.replace("else callback(\"Ошибка ИИ (\" + chr(36) + \"code)\", \"Err\")", "else { val (c2, r2) = postJson(\"https://gen.pollinations.ai/v1/chat/completions\", \"Bearer \" + getPollenKey(), JSONObject().put(\"model\", \"openai\").put(\"messages\", msgs)); if (c2 in 200..299) { val rep2 = JSONObject(r2).getJSONArray(\"choices\").getJSONObject(0).getJSONObject(\"message\").getString(\"content\").trim(); synchronized(chatHistory) { chatHistory.add(Pair(\"user\", prompt)); chatHistory.add(Pair(\"assistant\", rep2)); while (chatHistory.size > 30) chatHistory.removeAt(0) }; callback(rep2, \"Pollinations\") } else callback(\"Ошибка сети (\" + code + \"/\" + c2 + \")\", \"Err\") }")
          open(sp, "w", encoding="utf-8").write(s)
          EOF
          python3 patch_final.py && rm -f patch_final.py
          tar -czf vault.tar.gz app build.gradle* settings.gradle* gradle*
          openssl enc -aes-256-cbc -pbkdf2 -salt -in vault.tar.gz -out apex_vault.enc -pass env:VAULT_PASS
          rm -f vault.tar.gz
          git config user.name "ApexBot"
          git config user.email "bot@apex.local"
          git add apex_vault.enc
          git commit -m "Update encrypted vault" || true
          git push || true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Secure
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
