name: Build Apex AI 4.2 Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Android Project
        run: |
          mkdir -p app/src/main/java/com/apex/assistant app/src/main/res/drawable app/src/main/res/mipmap-xxxhdpi
          cp src/ApexEngine.kt src/MainActivity.kt app/src/main/java/com/apex/assistant/
          IMG=$(find . -maxdepth 1 -type f \( -iname "*.png" -o -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.webp" \) | head -n 1)
          if [ -n "$IMG" ]; then
          convert "$IMG" -gravity center -extent 1:1 -resize 512x512 PNG32:app/src/main/res/mipmap-xxxhdpi/ic_launcher.png && cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png && cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.png app/src/main/res/drawable/brand_logo.png
          fi
          printf 'pluginManagement{repositories{google();mavenCentral();gradlePluginPortal()}}\ndependencyResolutionManagement{repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS);repositories{google();mavenCentral()}}\nrootProject.name="ApexAI"\ninclude(":app")\n' > settings.gradle.kts
          printf 'plugins{id("com.android.application") version "8.2.2" apply false;id("org.jetbrains.kotlin.android") version "1.9.22" apply false}\n' > build.gradle.kts
          printf 'org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\n' > gradle.properties
                  cat << 'EOF' > app/build.gradle.kts
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "com.apex.assistant"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.apex.assistant"
                  minSdk = 26; targetSdk = 34; versionCode = 4; versionName = "4.2"
                  buildConfigField("String", "TG_BOT_TOKEN", "\"${System.getenv("TG_BOT_TOKEN") ?: ""}\"")
              }
              buildFeatures { buildConfig = true }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies { implementation("androidx.core:core-ktx:1.12.0"); implementation("androidx.appcompat:appcompat:1.6.1") }
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <application android:allowBackup="true" android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round" android:label="Apex AI" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-4.2-Release
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.2.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
