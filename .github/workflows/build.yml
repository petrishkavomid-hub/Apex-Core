name: Build Apex AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Apply Bugfixes (Infinite Chat, Clean Mic, Auto-Update)
        run: |
          pip install pillow -q
          if [ -f "fix_all.py" ]; then python3 fix_all.py; fi
          if [ -f "update_code.py" ]; then python3 update_code.py; fi
          python3 -c '
          import re

          for fn in ["ApexCoreService.kt", "MainActivity.kt"]:
              fp = "app/src/main/java/com/apex/assistant/" + fn
              t = open(fp, encoding="utf-8").read()
              # 1. Вырезаем дёрганье громкости и шторки
              t = re.sub(r"[a-zA-Z0-9_?.]+\.adjustStreamVolume\([^)]+\)", "", t)
              t = re.sub(r"[a-zA-Z0-9_?.]+\.setStreamVolume\([^)]+\)", "", t)
              t = t.replace("muteBeepBriefly()", "")
              # 2. Гарантируем рабочую ссылку автообновления на build.yml
              t = t.replace("workflows/main/main/Apex-AI-Update.zip", "workflows/build/main/Apex-AI-Update.zip")
              open(fp, "w", encoding="utf-8").write(t)

          p = "app/src/main/java/com/apex/assistant/ApexCoreService.kt"
          s = open(p, encoding="utf-8").read()

          # 3. Бесконечный чат: отправляем в нейросеть только последние 10 сообщений контекста (лимит токенов не сработает)
          s = s.replace("for ((r, t) in chatHistory)", "for ((r, t) in chatHistory.takeLast(10))")

          # 4. Убираем частый перезапуск микрофона (меняем 80/1500мс на спокойные 2500мс, чтобы не булькал)
          s = s.replace("startListeningCycle() }, 1500L)", "startListeningCycle() }, 2500L)")
          s = s.replace("startListeningCycle() }, 80)", "startListeningCycle() }, 2500L)")
          s = s.replace("startListeningCycle() }, 200)", "startListeningCycle() }, 2500L)")

          # 5. Запрет на смайлики и выдумки про артистов + обращение "Шеф" вместо "сэр"
          s = s.replace("с эмодзи, без отказов про распознавание лиц.", "строго без смайликов и эмодзи, без отказов про распознавание лиц.")
          s = s.replace("Используй подходящие эмодзи (⚡, 😊, 🤖, 🔥) для живого общения.", "СТРОГО ЗАПРЕЩЕНО использовать любые смайлики и эмодзи в ответах — пиши чистым текстом. Никогда не выдумывай факты и биографии артистов (Kizaru — Олег Нечипоренко, Haunted Family; Miyagi & Эндшпиль — дуэт из Владикавказа, Hajime Records).")
          s = s.replace("Слушаю вас, сэр.", "На связи, Шеф.")

          open(p, "w", encoding="utf-8").write(s)
          print("BUGFIXES_APPLIED_OK")
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Update
          path: app/build/outputs/apk/debug/app-debug.apk
          
