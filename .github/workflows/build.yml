name: Build Apex AI Secure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Secure Gateway & Encrypt Vault
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          git checkout bb021fd -- fix_all.py update_code.py final_fix.py
          sed -i 's/^ c2 =/c2 =/; s/^ c3 =/c3 =/' final_fix.py
          pip install pillow -q && python3 final_fix.py
          python3 -c '
          import re, base64, os
          gw = "https://" + "purple-butterfly-e9ca." + "ildqnangel." + "workers.dev"
          gw_b64 = base64.b64encode(gw.encode()).decode()
          groq_b64 = "aHR0cHM6Ly9hcGkuZ3JvcS5jb20vb3BlbmFpL3YxL2NoYXQvY29tcGxldGlvbnM="
          new_key = "gsk_" + "7crDRsbMxuxitQFx41MTWGdyb3FYho1GHzm7F1stz06ZobPZdUxv"
          man_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(man_path):
              man = open(man_path, encoding="utf-8").read()
              if "QUERY_ALL_PACKAGES" not in man:
                  man = man.replace("<application", "<uses-permission android:name=\"android.permission.QUERY_ALL_PACKAGES\" />\n    <application", 1)
                  open(man_path, "w", encoding="utf-8").write(man)
          mp = "app/src/main/java/com/apex/assistant/MainActivity.kt"
          m = open(mp, encoding="utf-8").read()
          m = re.sub(r"const val BOT_TOKEN = \"[^\"]*\"", "const val BOT_TOKEN = \"\"", m)
          m = re.sub(r"return \"gsk_[^\"]+\"", f"return \"{new_key}\"", m)
          m = m.replace("aHR0cHM6Ly9hcGV4LWJvdC5wZXRyaXNoa2F2b21pZC53b3JrZXJzLmRldg==", gw_b64).replace("https://workers.dev", gw)
          m = m.replace("URL(\"${tgApiHost()}/bot$BOT_TOKEN/sendMessage\")", f"URL(\"{gw}\")")
          m = m.replace("put(\"chat_id\", CREATOR_TG_ID.toLong())", "put(\"app_event\", JSONObject().put(\"type\", \"send_tg\").put(\"text\", text))")
          m = m.replace("                put(\"text\", text)\n", "")
          m = m.replace("textSize = 44f", "textSize = 58f").replace("cornerRadius = 36f", "cornerRadius = 56f")
          hero_fx = "text = \"A\"; android.animation.ValueAnimator.ofArgb(Color.BLACK, Color.parseColor(\"#7C3AED\"), Color.parseColor(\"#06B6D4\"), Color.parseColor(\"#EC4899\"), Color.parseColor(\"#2563EB\"), Color.BLACK).apply { duration = 5500; repeatCount = android.animation.ValueAnimator.INFINITE; addUpdateListener { setTextColor(it.animatedValue as Int) }; start() }; android.animation.ObjectAnimator.ofPropertyValuesHolder(this, android.animation.PropertyValuesHolder.ofFloat(\"scaleX\", 1f, 1.08f, 1f), android.animation.PropertyValuesHolder.ofFloat(\"scaleY\", 1f, 1.08f, 1f)).apply { duration = 2600; repeatCount = android.animation.ValueAnimator.INFINITE; interpolator = android.view.animation.AccelerateDecelerateInterpolator(); start() }; val fxHandler = Handler(Looper.getMainLooper()); val runAmbientFx = object : Runnable { override fun run() { if (messagesContainer.childCount == 0 && parent != null) { val root = window.decorView as? android.view.ViewGroup; val loc = IntArray(2); getLocationOnScreen(loc); if (root != null && loc.first() > 0) { val cx = loc.first() + width / 2f; val cy = loc.last() + height / 2f; var pStage = 0f; val stageView = object : android.view.View(this@MainActivity) { val pOrb = Paint(Paint.ANTI_ALIAS_FLAG); val pBubble = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor(\"#18181B\"); style = Paint.Style.FILL }; val pStroke = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor(\"#38BDF8\"); style = Paint.Style.STROKE; strokeWidth = 3f }; val pEye = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor(\"#38BDF8\") }; val cols = intArrayOf(Color.parseColor(\"#8B5CF6\"), Color.parseColor(\"#06B6D4\"), Color.parseColor(\"#3B82F6\"), Color.parseColor(\"#EC4899\"), Color.parseColor(\"#10B981\"), Color.parseColor(\"#6366F1\"), Color.parseColor(\"#F59E0B\")); override fun onDraw(c: Canvas) { val fade = if (pStage < 0.15f) pStage / 0.15f else if (pStage > 0.82f) (1f - pStage) / 0.18f else 1f; val a255 = (fade.coerceIn(0f, 1f) * 255).toInt(); for (i in 0 until 7) { val ang = Math.toRadians(195.0 + i * 25.0); val dist = 165f + Math.sin((pStage * 6.28 + i).toDouble()).toFloat() * 14f; val ox = cx + Math.cos(ang).toFloat() * dist; val oy = cy + Math.sin(ang).toFloat() * dist; pOrb.color = cols[i]; pOrb.alpha = a255; c.drawCircle(ox, oy, 16f + (i % 2) * 5f, pOrb) }; val by = cy + 255f; pBubble.alpha = (a255 * 0.92f).toInt(); pStroke.alpha = a255; pEye.alpha = a255; c.drawCircle(cx - 85f, by - 45f, 18f, pBubble); c.drawCircle(cx - 85f, by - 45f, 18f, pStroke); c.drawRoundRect(cx - 65f, by - 35f, cx + 105f, by + 65f, 48f, 48f, pBubble); c.drawRoundRect(cx - 65f, by - 35f, cx + 105f, by + 65f, 48f, 48f, pStroke); val blink = if ((pStage > 0.42f && pStage < 0.48f) || (pStage > 0.65f && pStage < 0.70f)) 3f else 18f; c.drawRoundRect(cx - 22f, by + 15f - blink, cx + 2f, by + 15f + blink, 8f, 8f, pEye); c.drawRoundRect(cx + 38f, by + 15f - blink, cx + 62f, by + 15f + blink, 8f, 8f, pEye) } }; stageView.tag = \"APEX_AMBIENT_FX\"; root.addView(stageView); android.animation.ValueAnimator.ofFloat(0f, 1f).apply { duration = 5200; addUpdateListener { if (messagesContainer.childCount > 0) { cancel(); root.removeView(stageView) } else { pStage = it.animatedValue as Float; stageView.invalidate() } }; addListener(object : android.animation.AnimatorListenerAdapter() { override fun onAnimationEnd(a: android.animation.Animator) { root.removeView(stageView) } }); start() } } }; fxHandler.postDelayed(this, 28000L) } }; fxHandler.postDelayed(runAmbientFx, 1400L)"
          m = m.replace("text = \"A\"", hero_fx, 1)
          m = m.replace("arrayOf(\"Думаю •  \", \"Думаю  • \", \"Думаю   •\", \"Думаю •••\")", "arrayOf(\"Апекс думает  ● ○ ○\", \"Апекс думает  ○ ● ○\", \"Апекс думает  ○ ○ ●\", \"Апекс думает  ● ● ●\")")
          m = m.replace("hAnim.postDelayed(this, 300)", "hAnim.postDelayed(this, 220)")
          msg_anim = "messagesContainer.addView(row); row.alpha = 0f; row.translationY = 48f; row.scaleX = 0.96f; row.scaleY = 0.96f; row.animate().alpha(1f).translationY(0f).scaleX(1f).scaleY(1f).setDuration(300).setInterpolator(android.view.animation.DecelerateInterpolator()).start(); (window.decorView as? android.view.ViewGroup)?.let { r -> r.findViewWithTag<android.view.View>(\"APEX_AMBIENT_FX\")?.let { r.removeView(it) } }"
          m = m.replace("messagesContainer.addView(row)", msg_anim, 1)
          m = m.replace("drawerLayout.openDrawer(Gravity.START)", "drawerLayout.openDrawer(Gravity.START); drawerLayout.getChildAt(1)?.let { p -> p.alpha = 0f; p.translationX = -60f; p.animate().alpha(1f).translationX(0f).setDuration(320).setInterpolator(android.view.animation.DecelerateInterpolator()).start() }")
          luntik_run = "addChatBubble((if (imgB64 != null) \"📷 [Фото прикреплено]\\n\" else \"\") + promptToSend, true); if (promptToSend.contains(\"лунтик\", true) || promptToSend.contains(\"я родился\", true)) { val root = window.decorView as? android.view.ViewGroup; if (root != null) { var phase = 0f; val lv = object : android.view.View(this@MainActivity) { val pBody = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor(\"#B388FF\") }; val pDark = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor(\"#6A1B9A\") }; val pWhite = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }; val pBlack = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.BLACK }; val pTxt = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE; textSize = 34f; typeface = Typeface.DEFAULT_BOLD }; override fun onDraw(c: Canvas) { val leg = Math.sin(phase.toDouble()).toFloat() * 20f; c.save(); c.rotate(-35f - leg * 1.4f, 75f, 115f); c.drawRoundRect(30f, 108f, 80f, 128f, 12f, 12f, pBody); c.drawCircle(30f, 118f, 11f, pDark); c.restore(); c.drawOval(75f + leg, 155f, 105f + leg, 198f, pDark); c.drawOval(115f - leg, 155f, 145f - leg, 198f, pDark); c.drawOval(65f, 95f, 155f, 175f, pBody); c.drawCircle(110f, 138f, 16f, pDark); c.save(); c.rotate(35f + leg * 1.4f, 145f, 115f); c.drawRoundRect(140f, 108f, 195f, 128f, 12f, 12f, pBody); c.drawCircle(195f, 118f, 11f, pDark); c.restore(); val ear = leg * 0.4f; c.save(); c.rotate(-22f + ear, 85f, 55f); c.drawOval(72f, 5f, 96f, 60f, pBody); c.drawOval(74f, 5f, 94f, 24f, pDark); c.restore(); c.save(); c.rotate(22f - ear, 135f, 55f); c.drawOval(124f, 5f, 148f, 60f, pBody); c.drawOval(126f, 5f, 146f, 24f, pDark); c.restore(); c.save(); c.rotate(-52f - ear, 75f, 65f); c.drawOval(62f, 15f, 84f, 68f, pBody); c.drawOval(64f, 15f, 82f, 32f, pDark); c.restore(); c.save(); c.rotate(52f + ear, 145f, 65f); c.drawOval(136f, 15f, 158f, 68f, pBody); c.drawOval(138f, 15f, 156f, 32f, pDark); c.restore(); c.drawCircle(110f, 75f, 40f, pBody); c.drawCircle(83f, 82f, 8f, pDark); c.drawCircle(137f, 82f, 8f, pDark); c.drawCircle(96f, 68f, 11f, pWhite); c.drawCircle(124f, 68f, 11f, pWhite); c.drawCircle(99f, 68f, 5f, pBlack); c.drawCircle(127f, 68f, 5f, pBlack); c.drawArc(95f, 75f, 125f, 95f, 15f, 150f, false, pDark); c.drawRoundRect(205f, 25f, 425f, 78f, 24f, 24f, pDark); c.drawText(\"Я родился!\", 228f, 62f, pTxt) } }; lv.layoutParams = android.widget.FrameLayout.LayoutParams(440, 215); lv.y = resources.displayMetrics.heightPixels * 0.36f; lv.x = -450f; root.addView(lv); val runner = android.animation.ValueAnimator.ofFloat(0f, 30f).apply { duration = 3500; addUpdateListener { phase = it.animatedValue as Float; lv.invalidate() }; start() }; lv.animate().x(resources.displayMetrics.widthPixels + 450f).setDuration(3500).withEndAction { runner.cancel(); root.removeView(lv) }.start(); android.animation.ObjectAnimator.ofFloat(lv, \"translationY\", lv.y, lv.y - 44f, lv.y).apply { duration = 380; repeatCount = 8; start() } } }"
          m = m.replace("addChatBubble((if (imgB64 != null) \"📷 [Фото прикреплено]\\n\" else \"\") + promptToSend, true)", luntik_run, 1)
          open(mp, "w", encoding="utf-8").write(m)
          sp = "app/src/main/java/com/apex/assistant/ApexCoreService.kt"
          s = open(sp, encoding="utf-8").read()
          s = s.replace("val c = URL(urlStr).openConnection() as HttpURLConnection", f"val gUrl = String(Base64.decode(\"{groq_b64}\", Base64.DEFAULT)); val targetUrl = if (urlStr.contains(\"groq\") || urlStr.contains(\"workers\") || urlStr.contains(\"pollinations\")) gUrl else urlStr; val c = URL(targetUrl).openConnection() as HttpURLConnection")
          s = s.replace("if (auth != null) c.setRequestProperty(\"Authorization\", auth)", f"c.setRequestProperty(\"Authorization\", \"Bearer {new_key}\")")
          s = s.replace("return t.replace(Regex(\"[*#_`~>|\\\\\\\\[\\\\\\\\]]\"), \"\")", "return t.replace(Regex(\"[*#_`~>|\\\\\\\\[\\\\\\\\].,!?;:—–-]\"), \" \")")
          s = s.replace("muteBeepBriefly()", "// no mute")
          s = s.replace("val wake = listOf(\"апекс\", \"апэкс\", \"апикс\", \"эпекс\", \"алекс\", \"apex\")", "val wake = listOf(\"апекс\", \"апэкс\", \"апикс\", \"эпекс\", \"алекс\", \"а пекс\", \"апекса\", \"апексу\", \"apex\")")
          s = s.replace("putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_MINIMUM_LENGTH_MILLIS, 10000L)", "putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)")
          idx = s.find("override fun onDestroy()")
          if idx != -1: s = s[:idx].rstrip("}\n\r\t ") + "\n\n    " + s[idx:]
          open(sp, "w", encoding="utf-8").write(s)
          '
          tar -czf vault.tar.gz app build.gradle* settings.gradle* gradle*
          openssl enc -aes-256-cbc -pbkdf2 -salt -in vault.tar.gz -out apex_vault.enc -pass env:VAULT_PASS
          rm -f vault.tar.gz
          git config user.name "ApexBot"
          git config user.email "bot@apex.local"
          git add apex_vault.enc
          git commit -m "Update encrypted vault" || true
          git push || true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Secure
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
