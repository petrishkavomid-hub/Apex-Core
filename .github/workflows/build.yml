name: Build Apex AI Secure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Secure Gateway & Encrypt Vault
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          git checkout bb021fd -- fix_all.py update_code.py final_fix.py
          pip install pillow -q && python3 fix_all.py && python3 update_code.py
          cat << 'PYEND' > secure_patch.py
          import re, base64

          gw = "https://workers.dev"
          gw_b64 = base64.b64encode(gw.encode()).decode()

          # 1. Патчим MainActivity.kt (отправка оценки через твой воркер, без поломки UI и иконок)
          mp = "app/src/main/java/com/apex/assistant/MainActivity.kt"
          m = open(mp, encoding="utf-8").read()
          m = re.sub(r'const val BOT_TOKEN = "[^"]*"', 'const val BOT_TOKEN = ""', m)
          m = m.replace("aHR0cHM6Ly9hcGV4LWJvdC5wZXRyaXNoa2F2b21pZC53b3JrZXJzLmRldg==", gw_b64)
          m = m.replace("aHR0cHM6Ly9hcGkuZ3JvcS5jb20vb3BlbmFpL3YxL2NoYXQvY29tcGxldGlvbnM=", gw_b64)
          m = m.replace("https://workers.dev", gw)

          old_send = '''fun sendDirectToAdminBot(text: String, onDone: ((Boolean) -> Unit)? = null) {
            thread {
                try {
                    val conn = URL("${tgApiHost()}/bot$BOT_TOKEN/sendMessage").openConnection() as HttpURLConnection
                    conn.requestMethod = "POST"
                    conn.setRequestProperty("Content-Type", "application/json")
                    conn.connectTimeout = 15000
                    conn.readTimeout = 15000
                    conn.doOutput = true
                    val payload = JSONObject().apply {
                        put("chat_id", CREATOR_TG_ID.toLong())
                        put("text", text)
                    }
                    OutputStreamWriter(conn.outputStream).use { it.write(payload.toString()) }
                    val ok = conn.responseCode in 200..299
                    onDone?.invoke(ok)
                } catch (_: Exception) {
                    onDone?.invoke(false)
                }
            }
        }'''

          new_send = f'''fun sendDirectToAdminBot(text: String, onDone: ((Boolean) -> Unit)? = null) {{
            thread {{
                try {{
                    val conn = URL("{gw}").openConnection() as HttpURLConnection
                    conn.requestMethod = "POST"
                    conn.setRequestProperty("Content-Type", "application/json")
                    conn.connectTimeout = 15000
                    conn.readTimeout = 15000
                    conn.doOutput = true
                    val payload = JSONObject().apply {{
                        put("app_event", JSONObject().apply {{
                            put("type", "send_tg")
                            put("text", text)
                        }})
                    }}
                    OutputStreamWriter(conn.outputStream).use {{ it.write(payload.toString()) }}
                    val ok = conn.responseCode in 200..299
                    onDone?.invoke(ok)
                }} catch (_: Exception) {{
                    onDone?.invoke(false)
                }}
            }}
        }}'''

          if old_send in m:
              m = m.replace(old_send, new_send)
          else:
              m = m.replace('URL("${tgApiHost()}/bot$BOT_TOKEN/sendMessage")', f'URL("{gw}")')
              m = m.replace('put("chat_id", CREATOR_TG_ID.toLong())\n                        put("text", text)', 'put("app_event", JSONObject().put("type", "send_tg").put("text", text))')

          open(mp, "w", encoding="utf-8").write(m)

          # 2. Патчим ApexCoreService.kt (направляем ИИ в твой воркер + ретрай 429 + фикс голоса и микрофона)
          sp = "app/src/main/java/com/apex/assistant/ApexCoreService.kt"
          s = open(sp, encoding="utf-8").read()

          # Подменяем Base64 URL Groq на твой воркер
          s = s.replace("aHR0cHM6Ly9hcGkuZ3JvcS5jb20vb3BlbmFpL3YxL2NoYXQvY29tcGxldGlvbnM=", gw_b64)
          s = s.replace("https://groq.com", gw)
          s = s.replace("https://pollinations.ai", gw)
          s = re.sub(r'private fun getPollenKey\(\) = .*', 'private fun getPollenKey() = "worker_proxy"', s)
          s = s.replace('listOf("gemini", "openai", "openai-fast")', 'listOf("meta-llama/llama-4-scout-17b-16e-instruct")')

          # Характер Создателя
          old_sys = 'val sys = if (imageBase64 != null) {'
          new_sys = '''val creatorNote = if (isCreator) "Перед тобой твой Создатель и хозяин — Derek Stealth (Сергей). Обращайся к нему с уважением («сэр» или «босс»), будь максимально преданным и крутым напарником." else "Перед тобой обычный пользователь приложения Apex AI (не Создатель)."
                    val sys = if (imageBase64 != null) {'''
          s = s.replace(old_sys, new_sys)
          s = s.replace('${getMskTimeInfo()}', '${getMskTimeInfo()} $creatorNote')

          # Заворачиваем все запросы к воркеру в {"ai_chat": ...} + добавляем повтор при 429
          old_post = '''OutputStreamWriter(c.outputStream).use { it.write(body.toString()) }
            val code = c.responseCode
            val txt = (if (code in 200..299) c.inputStream else c.errorStream)?.bufferedReader()?.use { it.readText() } ?: ""
            return Pair(code, txt)'''

          new_post = '''val payload = if (urlStr.contains("workers.dev")) JSONObject().put("ai_chat", body).toString() else body.toString()
            OutputStreamWriter(c.outputStream).use { it.write(payload) }
            val code = c.responseCode
            val txt = (if (code in 200..299) c.inputStream else c.errorStream)?.bufferedReader()?.use { it.readText() } ?: ""
            if (code == 429 || txt.contains("перегружены") || txt.contains("Too Many Requests")) {
                Thread.sleep(1500)
                val c2 = URL(urlStr).openConnection() as HttpURLConnection
                c2.requestMethod = "POST"
                c2.setRequestProperty("Content-Type", "application/json")
                c2.connectTimeout = 8000; c2.readTimeout = 20000; c2.doOutput = true
                OutputStreamWriter(c2.outputStream).use { it.write(payload) }
                val code2 = c2.responseCode
                val txt2 = (if (code2 in 200..299) c2.inputStream else c2.errorStream)?.bufferedReader()?.use { it.readText() } ?: ""
                return Pair(code2, txt2)
            }
            return Pair(code, txt)'''

          s = s.replace(old_post, new_post)

          # Фикс голоса и микрофона: убираем постоянный destroy() в цикле (причина бульканья) и чиним TTS
          s = s.replace("tts?.setPitch(0.92f)", "tts?.setPitch(0.95f)")
          s = s.replace("tts?.setSpeechRate(1.12f)", "tts?.setSpeechRate(1.04f)")

          # Убираем пересоздание SpeechRecognizer при каждом перезапуске (именно оно вызывает "бульк" на Android)
          old_cycle = '''try { speechRecognizer?.cancel(); speechRecognizer?.destroy() } catch (_: Exception) {}
                muteBeepBriefly()
                speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)'''

          new_cycle = '''if (speechRecognizer == null) {
                    speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                }'''

          s = s.replace(old_cycle, new_cycle)

          # Если движок всё же занят — пересоздаём только при реальной ошибке, а не в нормальном цикле
          s = s.replace(
              'if (!handled && isListeningActive && !isSpeaking) {\n                            mainHandler.postDelayed({ startListeningCycle() }, 1500L)\n                        }',
              'if (!handled && isListeningActive && !isSpeaking) {\n                            if (e == SpeechRecognizer.ERROR_CLIENT || e == SpeechRecognizer.ERROR_RECOGNIZER_BUSY) { try { speechRecognizer?.destroy() } catch (_: Exception) {}; speechRecognizer = null }\n                            mainHandler.postDelayed({ startListeningCycle() }, 600L)\n                        }'
          )

          # Перед речью просто останавливаем прослушивание, не убивая объект TTS и не конфликтуя с аудиопотоком
          s = s.replace(
              'try { speechRecognizer?.cancel(); speechRecognizer?.destroy() } catch (_: Exception) {}\n            speechRecognizer = null',
              'try { speechRecognizer?.cancel() } catch (_: Exception) {}'
          )

          open(sp, "w", encoding="utf-8").write(s)
          PYEND
          python3 secure_patch.py
          rm -f secure_patch.py
          tar -czf vault.tar.gz app build.gradle* settings.gradle* gradle*
          openssl enc -aes-256-cbc -pbkdf2 -salt -in vault.tar.gz -out apex_vault.enc -pass env:VAULT_PASS
          rm -f vault.tar.gz
          git config user.name "ApexBot"
          git config user.email "bot@apex.local"
          git add apex_vault.enc
          git commit -m "Update encrypted vault" || true
          git push || true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Secure
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
