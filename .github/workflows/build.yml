; pArc.color = Color.parseColor("#A78BFA"); pArc.alpha = 185; val r2 = base * 1.44f * pulse; val a2 = (-pPhase * 72f) % 360f; c.drawArc(cx - r2, cy - r2, cx + r2, cy + r2, a2, 95f, false, pArc); c.drawArc(cx - r2, cy - r2, cx + r2, cy + r2, a2 + 180f, 95f, false, pArc); pTxt.textSize = base * 0.72f; val fm = pTxt.fontMetrics; c.drawText("A", cx, cy - (fm.ascent + fm.descent) / 2f, pTxt) } }\n'
