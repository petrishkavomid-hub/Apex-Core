          s = s.replace('c.setRequestProperty("Content-Type", "application/json")', 'c.setRequestProperty("Content-Type", "application/json"); c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126.0 Mobile Safari/537.36")')
