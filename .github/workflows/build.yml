              }

              private fun stopSpeech() {
                  tts?.stop()
                  resetSpeakBtn()
              }

              private fun resetSpeakBtn() {
                  activeSpeakBtn?.text = "Озвучить"
                  activeSpeakBtn = null
              }

              private fun speakClean(raw: String, btn: TextView?) {
                  stopSpeech()
                  if (btn != null) {
                      activeSpeakBtn = btn
                      btn.text = "Стоп"
                  }
                  val parts = raw.split(Regex("(?<=[.!?;—])\\s+"))
                      .map { it.replace(Regex("[^а-яА-ЯёЁa-zA-Z0-9\\s]"), " ").replace(Regex("\\s+"), " ").trim() }
                      .filter { it.isNotEmpty() }
                  if (parts.isEmpty()) { resetSpeakBtn(); return }
                  parts.forEachIndexed { idx, part ->
                      val mode = if (idx == 0) TextToSpeech.QUEUE_FLUSH else TextToSpeech.QUEUE_ADD
                      val uid = if (idx == parts.lastIndex) "LAST_SEG" else "SEG_$idx"
                      tts?.speak(part, mode, null, uid)
                      if (idx < parts.lastIndex) tts?.playSilentUtterance(240L, TextToSpeech.QUEUE_ADD, "PAUSE_$idx")
                  }
              }
                            private fun toggleVoice() {
                  if (isListening) {
                      isListening = false
                      recognizer?.stopListening()
                      micBtn.setColorFilter(Color.parseColor("#38BDF8"))
                      micBtn.animate().scaleX(1f).scaleY(1f).setDuration(150).start()
                      return
                  }
                  stopSpeech()
                  isListening = true
                  micBtn.setColorFilter(Color.parseColor("#EF4444"))
                  recognizer?.destroy()
                  recognizer = SpeechRecognizer.createSpeechRecognizer(this).apply {
                      setRecognitionListener(object : RecognitionListener {
                          override fun onReadyForSpeech(p: Bundle?) {}
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(v: Float) {
                              val s = 1f + (v.coerceIn(0f, 10f) / 35f)
                              micBtn.scaleX = s
                              micBtn.scaleY = s
                          }
                          override fun onBufferReceived(b: ByteArray?) {}
                          override fun onEndOfSpeech() {
                              isListening = false
                              micBtn.setColorFilter(Color.parseColor("#38BDF8"))
                              micBtn.animate().scaleX(1f).scaleY(1f).setDuration(150).start()
                          }
                          override fun onError(err: Int) {
                              isListening = false
                              micBtn.setColorFilter(Color.parseColor("#38BDF8"))
                              micBtn.animate().scaleX(1f).scaleY(1f).setDuration(150).start()
                          }
                          override fun onPartialResults(p: Bundle?) {}
                          override fun onEvent(t: Int, p: Bundle?) {}
                          override fun onResults(res: Bundle?) {
                              isListening = false
                              micBtn.setColorFilter(Color.parseColor("#38BDF8"))
                              micBtn.animate().scaleX(1f).scaleY(1f).setDuration(150).start()
                              val said = res?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                              if (!said.isNullOrBlank()) sendMessage(said)
                          }
                      })
                  }
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ru-RU")
                      putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, 60000L)
                  }
                  recognizer?.startListening(intent)
              }

              private fun saveCurrentChat() {
                  if (messages.isEmpty()) return
                  val prefs = getSharedPreferences("apex_chats", Context.MODE_PRIVATE)
                  val all = JSONObject(prefs.getString("data", "{}") ?: "{}")
                  val arr = JSONArray()
                  messages.forEach { (r, t) -> arr.put(JSONObject().put("r", r).put("t", t)) }
                  all.put(currentChatId, JSONObject().put("title", messages.first().second.take(34)).put("msgs", arr))
                  prefs.edit().putString("data", all.toString()).apply()
                  refreshHistoryUI()
              }

              private fun refreshHistoryUI() {
                  historyList.removeAllViews()
                  val prefs = getSharedPreferences("apex_chats", Context.MODE_PRIVATE)
                  val all = JSONObject(prefs.getString("data", "{}") ?: "{}")
                  all.keys().forEach { id ->
                      val obj = all.optJSONObject(id) ?: return@forEach
                      val item = TextView(this).apply {
                          text = obj.optString("title", "Диалог")
                          setTextColor(Color.parseColor("#CBD5E1"))
                          textSize = 13f
                          maxLines = 1
                          setPadding(dp(10), dp(10), dp(10), dp(10))
                          setOnClickListener {
                              currentChatId = id
                              messages.clear()
                              chatBox.removeAllViews()
                              centerHero.visibility = View.GONE
                              chatScroll.visibility = View.VISIBLE
                              val arr = obj.optJSONArray("msgs") ?: JSONArray()
                              for (i in 0 until arr.length()) {
                                  val m = arr.getJSONObject(i)
                                  val r = m.getString("r")
                                  val t = m.getString("t")
                                  messages.add(Pair(r, t))
                                  
                                  if (r == "user") addUserBubble(t) else addBotBubble(t)
                              }
                              drawer.closeDrawers()
                          }
                          setOnLongClickListener {
                              all.remove(id)
                              prefs.edit().putString("data", all.toString()).apply()
                              refreshHistoryUI()
                              Toast.makeText(this@MainActivity, "Диалог удалён", Toast.LENGTH_SHORT).show()
                              true
                          }
                      }
                      historyList.addView(item)
                  }
              }

              override fun onDestroy() {
                  tts?.shutdown()
                  recognizer?.destroy()
                  super.onDestroy()
              }

              class StarfieldView(ctx: Context) : View(ctx) {
                  private val paint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
                  private val stars = List(65) { Triple(Random.nextFloat(), Random.nextFloat(), Random.nextFloat() * 2.2f + 0.8f) }
                  override fun onDraw(canvas: Canvas) {
                      stars.forEachIndexed { i, (rx, ry, r) ->
                          paint.alpha = 40 + ((sin(System.currentTimeMillis() / 700.0 + i) + 1.0) * 65).toInt()
                          canvas.drawCircle(rx * width, ry * height, r, paint)
                      }
                      postInvalidateDelayed(80)
                  }
              }

              class ApexOrbView(ctx: Context) : View(ctx) {
                  private var angle = 0f
                  private val glowPaint = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val facetPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
                  private val arcPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      strokeWidth = 4f
                      strokeCap = Paint.Cap.ROUND
                  }
                  init {
                      ValueAnimator.ofFloat(0f, 360f).apply {
                          duration = 8000
                          repeatCount = ValueAnimator.INFINITE
                          interpolator = LinearInterpolator()
                          addUpdateListener { angle = it.animatedValue as Float; invalidate() }
                          start()
                      }
                  }
                  override fun onDraw(canvas: Canvas) {
                      val cx = width / 2f
                      val cy = height / 2f
                      val r = width * 0.36f
                      glowPaint.shader = RadialGradient(cx, cy, r * 1.35f, intArrayOf(Color.parseColor("#1D4ED8"), Color.parseColor("#080E1E"), Color.TRANSPARENT), null, Shader.TileMode.CLAMP)
                      canvas.drawCircle(cx, cy, r * 1.35f, glowPaint)

                      val rect1 = RectF(cx - r * 1.18f, cy - r * 1.18f, cx + r * 1.18f, cy + r * 1.18f)
                      arcPaint.color = Color.parseColor("#38BDF8")
                      canvas.drawArc(rect1, angle, 95f, false, arcPaint)
                      canvas.drawArc(rect1, angle + 180f, 95f, false, arcPaint)

                      val leftPath = Path().apply {
                          moveTo(cx, cy - r * 0.72f)
                          lineTo(cx - r * 0.68f, cy + r * 0.58f)
                          lineTo(cx - r * 0.32f, cy + r * 0.58f)
                          lineTo(cx, cy - r * 0.06f)
                          close()
                      }
                      facetPaint.shader = LinearGradient(cx, cy - r * 0.72f, cx - r * 0.68f, cy + r * 0.58f, Color.parseColor("#7DD3FC"), Color.parseColor("#1D4ED8"), Shader.TileMode.CLAMP)
                      canvas.drawPath(leftPath, facetPaint)

                      val rightPath = Path().apply {
                          moveTo(cx, cy - r * 0.72f)
                          lineTo(cx + r * 0.68f, cy + r * 0.58f)
                          lineTo(cx + r * 0.32f, cy + r * 0.58f)
                          lineTo(cx, cy - r * 0.06f)
                          close()
                      }
                      facetPaint.shader = LinearGradient(cx, cy - r * 0.72f, cx + r * 0.68f, cy + r * 0.58f, Color.parseColor("#38BDF8"), Color.parseColor("#1E40AF"), Shader.TileMode.CLAMP)
                      canvas.drawPath(rightPath, facetPaint)

                      val innerPath = Path().apply {
                          moveTo(cx, cy + r * 0.06f)
                          lineTo(cx + r * 0.28f, cy + r * 0.36f)
                          lineTo(cx - r * 0.14f, cy + r * 0.26f)
                          close()
                      }
                      facetPaint.shader = null
                      facetPaint.color = Color.parseColor("#0284C7")
                                            canvas.drawPath(innerPath, facetPaint)

                      glowPaint.shader = RadialGradient(cx, cy + r * 0.68f, r * 0.7f, intArrayOf(Color.parseColor("#E0F2FE"), Color.parseColor("#38BDF8"), Color.TRANSPARENT), null, Shader.TileMode.CLAMP)
                      canvas.save()
                      canvas.scale(1f, 0.14f, cx, cy + r * 0.68f)
                      canvas.drawCircle(cx, cy + r * 0.68f, r * 0.7f, glowPaint)
                      canvas.restore()
                  }
              }

              class RainbowCapsuleLayout(ctx: Context) : FrameLayout(ctx) {
                  private var phase = 0f
                  private val borderPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }
                  init {
                      setPadding(4, 4, 4, 4)
                      setWillNotDraw(false)
                      ValueAnimator.ofFloat(0f, 360f).apply {
                          duration = 5000
                          repeatCount = ValueAnimator.INFINITE
                          interpolator = LinearInterpolator()
                          addUpdateListener { phase = it.animatedValue as Float; invalidate() }
                          start()
                      }
                  }
                  override fun onDraw(canvas: Canvas) {
                      val matrix = Matrix().apply { postRotate(phase, width / 2f, height / 2f) }
                      val shader = SweepGradient(width / 2f, height / 2f, intArrayOf(
                          Color.parseColor("#38BDF8"),
                          Color.parseColor("#818CF8"),
                          Color.parseColor("#C084FC"),
                          Color.parseColor("#38BDF8")
                      ), null).apply { setLocalMatrix(matrix) }
                      borderPaint.shader = shader
                      val rad = 28f * resources.displayMetrics.density
                      canvas.drawRoundRect(RectF(0f, 0f, width.toFloat(), height.toFloat()), rad, rad, borderPaint)
                      super.onDraw(canvas)
                  }
              }
          }
