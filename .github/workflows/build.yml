name: Build Apex AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore UI & Download Neural Voice
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout bb021fd -- fix_all.py update_code.py final_fix.py
          pip install pillow -q && python3 fix_all.py && python3 update_code.py
          mkdir -p app/libs app/src/main/assets/tts
          gh release download -R k2-fsa/sherpa-onnx -p "*.aar" -D app/libs/
          mv app/libs/*.aar app/libs/sherpa-onnx.aar
          gh release download tts-models -R k2-fsa/sherpa-onnx -p "vits-piper-ru_RU-dmitri-medium.tar.bz2" -D /tmp/
          tar -xjf /tmp/vits-piper-ru_RU-dmitri-medium.tar.bz2 -C /tmp/
          cp /tmp/vits-piper-ru_RU-*/*.onnx app/src/main/assets/tts/model.onnx
          cp /tmp/vits-piper-ru_RU-*/tokens.txt app/src/main/assets/tts/tokens.txt
          cp -r /tmp/vits-piper-ru_RU-*/espeak-ng-data app/src/main/assets/tts/espeak-ng-data
          grep -q "sherpa-onnx.aar" app/build.gradle || sed -i 's/dependencies {/dependencies {\n    implementation files("libs\/sherpa-onnx.aar")/' app/build.gradle

      - name: Patch ApexCoreService
        run: |
          cat << 'PYEND' > patch_voice.py
          import re
          p = "app/src/main/java/com/apex/assistant/ApexCoreService.kt"
          s = open(p, encoding="utf-8").read()
          s = re.sub(r"private fun muteBeepBriefly\(\)\s*\{.*?\n    \}", "private fun muteBeepBriefly() {}", s, flags=re.DOTALL)
          s = s.replace('if (code in 200..299) {', 'if (code in 200..299 && !raw.contains("credits", true) && !raw.contains("top-up", true)) {')
          s = s.replace('if (fCode in 200..299) {', 'if (fCode in 200..299 && !fRaw.contains("credits", true) && !fRaw.contains("top-up", true)) {')
          s = s.replace("for ((r, t) in chatHistory)", "for ((r, t) in chatHistory.takeLast(10))")
          neural_tts = """    private var neuralTts: com.k2fsa.sherpa.onnx.OfflineTts? = null
              private var pcmTrack: android.media.AudioTrack? = null
              private fun copyAssetDir(ap: String, dd: java.io.File) {
                  if (!dd.exists()) dd.mkdirs()
                  for (it in assets.list(ap) ?: emptyArray()) {
                      val sa = "$ap/$it"; val sd = java.io.File(dd, it)
                      if ((assets.list(sa)?.size ?: 0) > 0) copyAssetDir(sa, sd)
                      else if (!sd.exists()) assets.open(sa).use { i -> java.io.FileOutputStream(sd).use { o -> i.copyTo(o) } }
                  }
              }
              private fun initNeuralVoice() {
                  thread {
                      try {
                          val outDir = java.io.File(filesDir, "tts_v2")
                          if (!outDir.exists()) outDir.mkdirs()
                          for (fn in listOf("model.onnx", "tokens.txt")) {
                              val dst = java.io.File(outDir, fn)
                              if (!dst.exists() || dst.length() < 10) assets.open("tts/$fn").use { i -> java.io.FileOutputStream(dst).use { o -> i.copyTo(o) } }
                          }
                          copyAssetDir("tts/espeak-ng-data", java.io.File(outDir, "espeak-ng-data"))
                          val vits = com.k2fsa.sherpa.onnx.OfflineTtsVitsModelConfig(model = java.io.File(outDir, "model.onnx").absolutePath, tokens = java.io.File(outDir, "tokens.txt").absolutePath, dataDir = java.io.File(outDir, "espeak-ng-data").absolutePath)
                          neuralTts = com.k2fsa.sherpa.onnx.OfflineTts(config = com.k2fsa.sherpa.onnx.OfflineTtsConfig(model = com.k2fsa.sherpa.onnx.OfflineTtsModelConfig(vits = vits, numThreads = 2, provider = "cpu")))
                          ttsReady = true
                      } catch (_: Exception) {}
                  }
              }
              private fun speakClean(text: String) {
                  val c = cleanSpeech(text)
                  if (c.isEmpty()) { isSpeaking = false; if (isListeningActive) startListeningCycle(); return }
                  if (neuralTts == null) { initNeuralVoice(); isSpeaking = false; if (isListeningActive) startListeningCycle(); return }
                  isSpeaking = true
                  mainHandler.post { try { speechRecognizer?.cancel(); speechRecognizer?.destroy() } catch (_: Exception) {}; speechRecognizer = null }
                  thread {
                      try {
                          val audio = neuralTts?.generate(text = c, sid = 0, speed = 1.08f)
                          if (audio != null && audio.samples.isNotEmpty()) {
                              val sr = audio.sampleRate
                              val shorts = ShortArray(audio.samples.size) { i -> (audio.samples[i].coerceIn(-1.0f, 1.0f) * 32767f).toInt().toShort() }
                              try { pcmTrack?.stop(); pcmTrack?.release() } catch (_: Exception) {}
                              val track = android.media.AudioTrack.Builder()
                                  .setAudioAttributes(android.media.AudioAttributes.Builder().setUsage(android.media.AudioAttributes.USAGE_MEDIA).setContentType(android.media.AudioAttributes.CONTENT_TYPE_SPEECH).build())
                                  .setAudioFormat(android.media.AudioFormat.Builder().setEncoding(android.media.AudioFormat.ENCODING_PCM_16BIT).setSampleRate(sr).setChannelMask(android.media.AudioFormat.CHANNEL_OUT_MONO).build())
                                  .setBufferSizeInBytes(shorts.size * 2).setTransferMode(android.media.AudioTrack.MODE_STATIC).build()
                              pcmTrack = track; track.write(shorts, 0, shorts.size); track.play()
                              Thread.sleep((shorts.size * 1000L / sr) + 250L)
                              try { track.stop(); track.release() } catch (_: Exception) {}
                          }
                      } catch (_: Exception) {}
                      isSpeaking = false
                      if (isListeningActive) mainHandler.postDelayed({ startListeningCycle() }, 1500L)
                  }
              }"""
          if "override fun onCreate()" in s and "initNeuralVoice()" not in s:
              s = s.replace("override fun onCreate() {", "override fun onCreate() {\n        initNeuralVoice()")
          s = re.sub(r"    private fun speakClean\(text: String\) \{.*?    private fun startListeningCycle\(\)", neural_tts + "\n\n    private fun startListeningCycle()", s, flags=re.DOTALL)
          s = s.replace("с эмодзи, без отказов про распознавание лиц.", "строго без смайликов и эмодзи, без отказов про распознавание лиц.")
          s = s.replace("Используй подходящие эмодзи (⚡, 😊, 🤖, 🔥) для живого общения.", "СТРОГО ЗАПРЕЩЕНО использовать любые смайлики и эмодзи в ответах — пиши чистым текстом. Никогда не выдумывай факты и биографии артистов (Kizaru — Олег Нечипоренко, Haunted Family; Miyagi & Эндшпиль — дуэт из Владикавказа, Hajime Records).")
          s = s.replace("Слушаю вас, сэр.", "На связи, Шеф.")
          open(p, "w", encoding="utf-8").write(s)
          PYEND
          python3 patch_voice.py

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Update
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
