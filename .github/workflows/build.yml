name: Build Apex AI Secure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Secure Gateway & Encrypt Vault
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          git checkout bb021fd -- fix_all.py update_code.py final_fix.py
          pip install pillow -q && python3 final_fix.py && python3 update_code.py
          python3 -c '
          import re, base64
          gw = "https://workers.dev"
          gw_b64 = base64.b64encode(gw.encode()).decode()

          # 1. MainActivity.kt — направляем оценки в твой воркер с User-Agent (лого, иконки, UI не трогаем)
          mp = "app/src/main/java/com/apex/assistant/MainActivity.kt"
          m = open(mp, encoding="utf-8").read()
          m = re.sub(r"const val BOT_TOKEN = \"[^\"]*\"", "const val BOT_TOKEN = \"\"", m)
          m = m.replace("aHR0cHM6Ly9hcGV4LWJvdC5wZXRyaXNoa2F2b21pZC53b3JrZXJzLmRldg==", gw_b64)
          m = m.replace("aHR0cHM6Ly9hcGkuZ3JvcS5jb20vb3BlbmFpL3YxL2NoYXQvY29tcGxldGlvbnM=", gw_b64)
          m = m.replace("https://workers.dev", gw)
          m = m.replace("URL(\"${tgApiHost()}/bot$BOT_TOKEN/sendMessage\")", f"URL(\"{gw}\")")
          m = m.replace("conn.setRequestProperty(\"Content-Type\", \"application/json\")", "conn.setRequestProperty(\"Content-Type\", \"application/json\"); conn.setRequestProperty(\"User-Agent\", \"Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120.0.0.0 Mobile Safari/537.36\")")
          m = m.replace("put(\"chat_id\", CREATOR_TG_ID.toLong())", "put(\"app_event\", JSONObject().put(\"type\", \"send_tg\").put(\"text\", text))")
          m = m.replace("put(\"text\", text)\n                    }", "}")
          open(mp, "w", encoding="utf-8").write(m)

          # 2. ApexCoreService.kt — чистый шлюз в воркер + студийный голос Onyx + микрофон без бульканья
          sp = "app/src/main/java/com/apex/assistant/ApexCoreService.kt"
          s = open(sp, encoding="utf-8").read()

          s = s.replace("https://groq.com", gw)
          s = s.replace("https://pollinations.ai", gw)
          s = s.replace("c.setRequestProperty(\"Content-Type\", \"application/json\")", "c.setRequestProperty(\"Content-Type\", \"application/json\"); c.setRequestProperty(\"User-Agent\", \"Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/120.0.0.0 Mobile Safari/537.36\")")
          s = s.replace("OutputStreamWriter(c.outputStream).use { it.write(body.toString()) }", "val p = if (urlStr.contains(\"workers.dev\")) JSONObject().put(\"ai_chat\", body).toString() else body.toString(); OutputStreamWriter(c.outputStream).use { it.write(p) }")
          s = s.replace("val rep = JSONObject(raw)", "val cleanRaw = raw.trim(); if (!cleanRaw.startsWith(\"{\")) throw Exception(\"Сервер вернул не JSON: \" + cleanRaw.replace(Regex(\"<[^>]*>\"), \" \").trim().take(100)); val rep = JSONObject(cleanRaw)")

          # Студийный голос Onyx + авто-подстраховка системным TTS
          s = s.replace("https://google.com", "https://pollinations.ai\" + enc + \"?model=openai-audio&voice=onyx")
          s = s.replace("setDataSource(urlStr)", "val uc = URL(urlStr).openConnection() as HttpURLConnection; uc.setRequestProperty(\"User-Agent\", \"Mozilla/5.0\"); val b = uc.inputStream.readBytes(); if (b.size < 2000 || String(b.take(25).toByteArray()).contains(\"DOCTYPE\", true)) throw Exception(\"NoMP3\"); val f = java.io.File(cacheDir, \"v_\" + System.currentTimeMillis() + \".mp3\"); f.writeBytes(b); setDataSource(f.absolutePath)")
          s = s.replace("tts?.speak(c, TextToSpeech.QUEUE_FLUSH, b, \"APEX_LAST\")", "speakOnlineFallback(c)")

          # Убираем постоянный destroy() и muteBeepBriefly() в цикле (причина бульканья микрофона)
          s = s.replace("try { speechRecognizer?.cancel(); speechRecognizer?.destroy() } catch (_: Exception) {}\n                muteBeepBriefly()\n                speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)", "if (speechRecognizer == null) { speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this) }")
          s = s.replace("try { speechRecognizer?.cancel(); speechRecognizer?.destroy() } catch (_: Exception) {}\n            speechRecognizer = null", "try { speechRecognizer?.cancel() } catch (_: Exception) {}")

          open(sp, "w", encoding="utf-8").write(s)
          '
          tar -czf vault.tar.gz app build.gradle* settings.gradle* gradle*
          openssl enc -aes-256-cbc -pbkdf2 -salt -in vault.tar.gz -out apex_vault.enc -pass env:VAULT_PASS
          rm -f vault.tar.gz
          git config user.name "ApexBot"
          git config user.email "bot@apex.local"
          git add apex_vault.enc
          git commit -m "Update encrypted vault" || true
          git push || true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Secure
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
