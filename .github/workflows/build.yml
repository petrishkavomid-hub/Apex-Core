name: Build Apex AI Secure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Secure Gateway & Encrypt Vault
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          git checkout bb021fd -- fix_all.py update_code.py final_fix.py
          pip install pillow -q && python3 fix_all.py && python3 update_code.py
          cat << 'PYEND' > secure_patch.py
          import re, base64
          gw = "https://workers.dev"
          gw_b64 = base64.b64encode(gw.encode()).decode()

          # 1. Патчим MainActivity.kt (оценка в бота, пуши, права, убираем старый токен)
          mp = "app/src/main/java/com/apex/assistant/MainActivity.kt"
          m = open(mp, encoding="utf-8").read()
          m = re.sub(r'const val BOT_TOKEN = "[^"]*"', 'const val BOT_TOKEN = ""', m)
          m = m.replace("aHR0cHM6Ly9hcGV4LWJvdC5wZXRyaXNoa2F2b21pZC53b3JrZXJzLmRldg==", gw_b64)
          m = m.replace("aHR0cHM6Ly9hcGkuZ3JvcS5jb20vb3BlbmFpL3YxL2NoYXQvY29tcGxldGlvbnM=", gw_b64)
          m = m.replace("https://workers.dev", gw)
          m = m.replace("https://telegram.org", gw)
          m = re.sub(r'URL\("[^"]*sendMessage"\)', f'URL("{gw}")', m)
          m = re.sub(r'put\("chat_id",\s*CREATOR_TG_ID\.toLong\(\)\)\s*put\("text",\s*text\)', 'put("app_event", JSONObject().put("type", "send_tg").put("text", text))', m)
          m = re.sub(r'put\("chat_id",\s*CREATOR_TG_ID\)\s*put\("text",\s*text\)', 'put("app_event", JSONObject().put("type", "send_tg").put("text", text))', m)
          open(mp, "w", encoding="utf-8").write(m)

          # 2. Патчим ApexCoreService.kt (чат, фото, характер Создателя, голос)
          sp = "app/src/main/java/com/apex/assistant/ApexCoreService.kt"
          s = open(sp, encoding="utf-8").read()
          s = re.sub(r'private fun getPollenKey\(\) = .*', 'private fun getPollenKey() = "worker_proxy"', s)
          s = s.replace("https://pollinations.ai", gw)
          s = s.replace("https://groq.com", gw)
          s = s.replace('listOf("gemini", "openai", "openai-fast")', 'listOf("meta-llama/llama-4-scout-17b-16e-instruct")')

          # Возвращаем различие Создателя vs обычного юзера в характер!
          old_sys = 'val sys = if (imageBase64 != null) {'
          new_sys = '''val creatorNote = if (isCreator) "Перед тобой твой Создатель и хозяин — Derek Stealth (Сергей). Обращайся к нему с уважением («сэр» или «босс»), будь максимально преданным и крутым напарником." else "Перед тобой обычный пользователь приложения Apex AI (не Создатель)."
                    val sys = if (imageBase64 != null) {'''
          s = s.replace(old_sys, new_sys)
          s = s.replace('${getMskTimeInfo()}', '${getMskTimeInfo()} $creatorNote')

          # Оборачиваем запрос для воркера в {"ai_chat": ...} прямо в postJson!
          s = s.replace(
              'OutputStreamWriter(c.outputStream).use { it.write(body.toString()) }',
              'val payload = if (urlStr.contains("workers.dev")) JSONObject().put("ai_chat", body).toString() else body.toString()\n            OutputStreamWriter(c.outputStream).use { it.write(payload) }'
          )
          open(sp, "w", encoding="utf-8").write(s)
          PYEND
          python3 secure_patch.py
          rm -f secure_patch.py
          tar -czf vault.tar.gz app build.gradle* settings.gradle* gradle*
          openssl enc -aes-256-cbc -pbkdf2 -salt -in vault.tar.gz -out apex_vault.enc -pass env:VAULT_PASS
          rm -f vault.tar.gz
          git config user.name "ApexBot"
          git config user.email "bot@apex.local"
          git add apex_vault.enc
          git commit -m "Update encrypted vault" || true
          git push || true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Secure
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
