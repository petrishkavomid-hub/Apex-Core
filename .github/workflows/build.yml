name: Show Exact Chat & Rating Code

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          git checkout bb021fd -- fix_all.py update_code.py final_fix.py
          pip install pillow -q && python3 fix_all.py && python3 update_code.py
          echo "=== MAIN ACTIVITY (ОЦЕНКА И ЧАТ) ==="
          grep -rn -C 12 -E "sendMessage|Оценка|groqUrl|thinkRow" app/src/main/java/com/apex/assistant/MainActivity.kt
          echo "=== CORE SERVICE (СЕРВЕРЫ ПЕРЕГРУЖЕНЫ) ==="
          grep -rn -C 15 "перегружены" app/src/main/java/com/apex/assistant/ApexCoreService.kt
          
