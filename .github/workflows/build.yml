          L = [x.replace("Math.sin(phase + k)", "Math.sin(phase.toDouble() + k)") for x in L]
                    
                    
          open("app/src/main/java/com/apex/assistant/MainActivity.kt", "w", encoding="utf-8").write("\n".join(L))
          sp = "app/src/main/java/com/apex/assistant/ApexCoreService.kt"
          s = open(sp, encoding="utf-8").read()
          s = re.sub(r"private var ttsReady = false", "private var ttsReady2 = false", s, count=1)
          s = s.replace("private fun muteBeepBriefly() {", "private fun muteBeepBriefly() { if (true) return;")
          s = s.replace("Джарвис на связи", "Apex AI на связи")
          s = s.replace("Bearer " + chr(36) + "key", f"Bearer {new_key}")
          s = s.replace('"START_VOICE" -> {', '"SPEAK_TEXT" -> { intent.getStringExtra("text")?.let { speak(it) } }; "START_VOICE" -> {')
          s = s.replace('val prompt = intent.getStringExtra("text") ?: ""', 'val prompt = intent.getStringExtra("text") ?: ""; val imgB64 = intent.getStringExtra("image_b64"); if (!imgB64.isNullOrEmpty()) { analyzeImage(imgB64, prompt); return START_STICKY }')
          s = s.replace("https://gen.pollinations.ai/v1/chat/completions", "https://api.groq.com/openai/v1/chat/completions")
          s = s.replace('listOf("gemini", "openai", "openai-fast")', 'listOf("meta-llama/llama-4-scout-17b-16e-instruct", "llama-3.2-11b-vision-preview")')
          s = s.replace('"Bearer " + getPollenKey()', f'"Bearer {new_key}"')
          s = s.replace("70L", "1400L")
          s = s.replace("tts?.setPitch(0.92f)", "tts?.setPitch(0.85f)").replace("tts?.setSpeechRate(1.12f)", "tts?.setSpeechRate(0.96f)")
          open(sp, "w", encoding="utf-8").write(s)
          EOF
          python3 write_ui.py && rm -f write_ui.py
          tar -czf vault.tar.gz app build.gradle* settings.gradle* gradle*
          openssl enc -aes-256-cbc -pbkdf2 -salt -in vault.tar.gz -out apex_vault.enc -pass env:VAULT_PASS
          rm -f vault.tar.gz
          git config user.name "ApexBot"
          git config user.email "bot@apex.local"
          git add apex_vault.enc
          git commit -m "Update encrypted vault" || true
          git push || true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Secure
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
