                            private fun verifySubOnStart() {
                  val prefs = getSharedPreferences("apex_prefs", Context.MODE_PRIVATE)
                  val savedUser = prefs.getString("tg_user", "") ?: ""
                  if (savedUser.isBlank()) {
                      showSubscriptionGate(isUnsubscribed = false)
                      return
                  }
                  thread {
                      val (ok, _) = ApexEngine.checkSubscription(savedUser)
                      if (!ok) runOnUiThread { showSubscriptionGate(isUnsubscribed = true) }
                  }
              }

              private fun showSubscriptionGate(isUnsubscribed: Boolean) {
                  val prefs = getSharedPreferences("apex_prefs", Context.MODE_PRIVATE)
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(22), dp(22), dp(22), dp(22))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#0B1120"))
                          cornerRadius = dp(22).toFloat()
                          setStroke(1, Color.parseColor("#1E3A8A"))
                      }
                  }
                  val title = TextView(this).apply {
                      text = if (isUnsubscribed) "Мы заметили, что вы отписались" else "Бесплатный доступ к Apex AI"
                      setTextColor(Color.WHITE)
                      textSize = 18f
                      setTypeface(null, Typeface.BOLD)
                      gravity = Gravity.CENTER
                  }
                  val desc = TextView(this).apply {
                      text = if (isUnsubscribed) {
                          "Вы отписались от Telegram-канала @Apexassistantcore.\nДля продолжения бесплатного использования подпишитесь обратно и нажмите «Проверить подписку»."
                      } else {
                          "Для бесплатного использования приложения подпишитесь на наш официальный Telegram-канал @Apexassistantcore, укажите ваш @username или Telegram ID и нажмите «Проверить подписку»."
                      }
                      setTextColor(Color.parseColor("#CBD5E1"))
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setPadding(0, dp(12), 0, dp(16))
                  }
                  val userEt = EditText(this).apply {
                      hint = "Ваш @username или Telegram ID"
                      setText(prefs.getString("tg_user", ""))
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.parseColor("#64748B"))
                      textSize = 14f
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#111827"))
                          cornerRadius = dp(12).toFloat()
                          setStroke(1, Color.parseColor("#334155"))
                      }
                  }
                  val statusTv = TextView(this).apply {
                      setTextColor(Color.parseColor("#F87171"))
                      textSize = 12f
                      gravity = Gravity.CENTER
                      setPadding(0, dp(8), 0, dp(8))
                  }
                  val subBtn = TextView(this).apply {
                      text = "1. Подписаться на @Apexassistantcore"
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      setTypeface(null, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                      background = GradientDrawable().apply { setColor(Color.parseColor("#0284C7")); cornerRadius = dp(14).toFloat() }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(6) }
                      setOnClickListener {
                          startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://t.me/Apexassistantcore")))
                      }
                  }
                  val checkBtn = TextView(this).apply {
                      text = "2. Проверить подписку"
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      setTypeface(null, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      setPadding(dp(14), dp(12), dp(14), dp(12))
                      background = GradientDrawable().apply { setColor(Color.parseColor("#1D4ED8")); cornerRadius = dp(14).toFloat() }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(10) }
                  }
                  box.addView(title); box.addView(desc); box.addView(userEt); box.addView(statusTv); box.addView(subBtn); box.addView(checkBtn)

                  val dlg = AlertDialog.Builder(this).setView(box).setCancelable(false).create()
                  dlg.window?.setBackgroundDrawableResource(android.R.color.transparent)
                  checkBtn.setOnClickListener {
                      val u = userEt.text.toString().trim()
                      if (u.isEmpty()) {
                          statusTv.text = "Введите ваш @username или Telegram ID"
                          return@setOnClickListener
                      }
                      statusTv.setTextColor(Color.parseColor("#38BDF8"))
                      statusTv.text = "Проверяем подписку..."
                      thread {
                          val (ok, msg) = ApexEngine.checkSubscription(u)
                          runOnUiThread {
                              if (ok) {
                                  prefs.edit().putString("tg_user", u).apply()
