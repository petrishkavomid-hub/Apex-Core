name: Build Apex AI Secure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore Original Peak Build
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          OLD_COMMIT=$(git rev-list -n 1 --before="4 days ago" HEAD -- apex_vault.enc)
          if [ -z "$OLD_COMMIT" ]; then OLD_COMMIT=$(git log --reverse --format=%H -- apex_vault.enc | head -n 1); fi
          echo "Restoring from commit: $OLD_COMMIT"
          git checkout $OLD_COMMIT -- apex_vault.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -in apex_vault.enc -out vault.tar.gz -pass env:VAULT_PASS
          tar -xzf vault.tar.gz && rm -f vault.tar.gz
                    python3 -c 'import re; k="gsk_"+"7crDRsbMxuxitQFx41MTWGdyb3FYho1GHzm7F1stz06ZobPZdUxv"; mp="app/src/main/java/com/apex/assistant/MainActivity.kt"; m=open(mp,encoding="utf-8").read(); m=re.sub(r"return \"gsk_[^\"]+\"", f"return \"{k}\"", m); open(mp,"w",encoding="utf-8").write(m)'
          tar -czf vault.tar.gz app build.gradle* settings.gradle* gradle*
          openssl enc -aes-256-cbc -pbkdf2 -salt -in vault.tar.gz -out apex_vault.enc -pass env:VAULT_PASS
          rm -f vault.tar.gz
          git config user.name "ApexBot"
          git config user.email "bot@apex.local"
          git add apex_vault.enc
          git commit -m "Restore original peak build" || true
          git push || true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Secure
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
