name: Build Apex AI Secure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Secure Gateway & Encrypt Vault
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          git checkout bb021fd -- fix_all.py update_code.py final_fix.py
          sed -i 's/^ c2 =/c2 =/; s/^ c3 =/c3 =/' final_fix.py
          pip install pillow -q && python3 final_fix.py && python3 update_code.py
          python3 -c '
          import re, base64, os
          gw = "https://" + "purple-butterfly-e9ca." + "ildqnangel." + "workers.dev"
          gw_b64 = base64.b64encode(gw.encode()).decode()
          new_key = "gsk_" + "7crDRsbMxuxitQFx41MTWGdyb3FYho1GHzm7F1stz06ZobPZdUxv"
          man_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(man_path):
              man = open(man_path, encoding="utf-8").read()
              if "QUERY_ALL_PACKAGES" not in man:
                  man = man.replace("<application", "<uses-permission android:name=\"android.permission.QUERY_ALL_PACKAGES\" />\n    <application", 1)
                  open(man_path, "w", encoding="utf-8").write(man)
          mp = "app/src/main/java/com/apex/assistant/MainActivity.kt"
          m = open(mp, encoding="utf-8").read()
          m = re.sub(r"const val BOT_TOKEN = \"[^\"]*\"", "const val BOT_TOKEN = \"\"", m)
          m = re.sub(r"return \"gsk_[^\"]+\"", f"return \"{new_key}\"", m)
          m = m.replace("aHR0cHM6Ly9hcGV4LWJvdC5wZXRyaXNoa2F2b21pZC53b3JrZXJzLmRldg==", gw_b64).replace("https://workers.dev", gw)
          m = m.replace("URL(\"${tgApiHost()}/bot$BOT_TOKEN/sendMessage\")", f"URL(\"{gw}\")")
          m = m.replace("put(\"chat_id\", CREATOR_TG_ID.toLong())", "put(\"app_event\", JSONObject().put(\"type\", \"send_tg\").put(\"text\", text))")
          m = m.replace("                put(\"text\", text)\n", "")
          m = m.replace("textSize = 44f", "textSize = 58f").replace("cornerRadius = 36f", "cornerRadius = 56f")
          hero_fx = "elevation = 20f\n            android.animation.ObjectAnimator.ofPropertyValuesHolder(this, android.animation.PropertyValuesHolder.ofFloat(\"scaleX\", 1f, 1.09f, 1f), android.animation.PropertyValuesHolder.ofFloat(\"scaleY\", 1f, 1.09f, 1f), android.animation.PropertyValuesHolder.ofFloat(\"rotation\", -2f, 2f, -2f)).apply { duration = 2600; repeatCount = android.animation.ValueAnimator.INFINITE; interpolator = android.view.animation.AccelerateDecelerateInterpolator(); start() }\n            val fxHandler = Handler(Looper.getMainLooper())\n            val runAmbientFx = object : Runnable { override fun run() { if (messagesContainer.childCount == 0 && parent != null) { val root = window.decorView as? android.view.ViewGroup; val loc = IntArray(2); getLocationOnScreen(loc); if (root != null && loc.first() > 0) { val cx = loc.first() + width / 2f; val cy = loc.last() + height / 2f; var pStage = 0f; val stageView = object : android.view.View(this@MainActivity) { val pOrb = Paint(Paint.ANTI_ALIAS_FLAG); val pRing = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor(\"#6366F1\"); style = Paint.Style.STROKE; strokeWidth = 4f }; val pRing2 = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor(\"#06B6D4\"); style = Paint.Style.STROKE; strokeWidth = 2f }; val pBubble = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor(\"#18181B\"); style = Paint.Style.FILL }; val pStroke = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor(\"#38BDF8\"); style = Paint.Style.STROKE; strokeWidth = 3f }; val pEye = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor(\"#38BDF8\") }; val cols = intArrayOf(Color.parseColor(\"#8B5CF6\"), Color.parseColor(\"#06B6D4\"), Color.parseColor(\"#3B82F6\"), Color.parseColor(\"#EC4899\"), Color.parseColor(\"#10B981\"), Color.parseColor(\"#6366F1\"), Color.parseColor(\"#F59E0B\")); override fun onDraw(c: Canvas) { val fade = if (pStage < 0.12f) pStage / 0.12f else if (pStage > 0.85f) (1f - pStage) / 0.15f else 1f; val a255 = (fade.coerceIn(0f, 1f) * 255).toInt(); pRing.alpha = (a255 * 0.7f).toInt(); pRing2.alpha = (a255 * 0.45f).toInt(); c.drawCircle(cx, cy, 105f + Math.sin(pStage * 12.0).toFloat() * 10f, pRing); c.drawCircle(cx, cy, 132f - Math.sin(pStage * 12.0).toFloat() * 8f, pRing2); for (i in 0 until 7) { val ang = Math.toRadians(190.0 + i * 26.0 + Math.sin(pStage * 6.28) * 12.0); val dist = 172f + Math.sin((pStage * 6.28 + i).toDouble()).toFloat() * 16f; val ox = cx + Math.cos(ang).toFloat() * dist; val oy = cy + Math.sin(ang).toFloat() * dist; pOrb.color = cols[i]; pOrb.alpha = a255; c.drawCircle(ox, oy, 16f + (i % 2) * 5f, pOrb) }; val by = cy + 250f + Math.sin(pStage * 9.42).toFloat() * 8f; pBubble.alpha = (a255 * 0.94f).toInt(); pStroke.alpha = a255; pEye.alpha = a255; c.drawCircle(cx - 85f, by - 45f, 18f, pBubble); c.drawCircle(cx - 85f, by - 45f, 18f, pStroke); c.drawRoundRect(cx - 65f, by - 35f, cx + 105f, by + 65f, 48f, 48f, pBubble); c.drawRoundRect(cx - 65f, by - 35f, cx + 105f, by + 65f, 48f, 48f, pStroke); val eyeShift = Math.sin(pStage * 9.42).toFloat() * 11f; val blink = if ((pStage > 0.40f && pStage < 0.46f) || (pStage > 0.66f && pStage < 0.72f)) 3f else 18f; c.drawRoundRect(cx - 22f + eyeShift, by + 15f - blink, cx + 2f + eyeShift, by + 15f + blink, 8f, 8f, pEye); c.drawRoundRect(cx + 38f + eyeShift, by + 15f - blink, cx + 62f + eyeShift, by + 15f + blink, 8f, 8f, pEye) } }; stageView.tag = \"APEX_AMBIENT_FX\"; root.addView(stageView); android.animation.ValueAnimator.ofFloat(0f, 1f).apply { duration = 6200; addUpdateListener { if (messagesContainer.childCount > 0) { cancel(); root.removeView(stageView) } else { pStage = it.animatedValue as Float; stageView.invalidate() } }; addListener(object : android.animation.AnimatorListenerAdapter() { override fun onAnimationEnd(a: android.animation.Animator) { root.removeView(stageView) } }); start() } } }; fxHandler.postDelayed(this, 18000L) } }\n            fxHandler.postDelayed(runAmbientFx, 600L)"
          m = m.replace("elevation = 8f", hero_fx, 1)
          m = m.replace("arrayOf(\"Думаю •  \", \"Думаю  • \", \"Думаю   •\", \"Думаю •••\")", "arrayOf(\"Апекс думает  ● ○ ○\", \"Апекс думает  ○ ● ○\", \"Апекс думает  ○ ○ ●\", \"Апекс думает  ● ● ●\")")
          m = m.replace("hAnim.postDelayed(this, 300)", "hAnim.postDelayed(this, 220)")
          msg_anim = "messagesContainer.addView(row); row.alpha = 0f; row.translationY = 48f; row.scaleX = 0.96f; row.scaleY = 0.96f; row.animate().alpha(1f).translationY(0f).scaleX(1f).scaleY(1f).setDuration(300).setInterpolator(android.view.animation.DecelerateInterpolator()).start(); (window.decorView as? android.view.ViewGroup)?.let { r -> r.findViewWithTag<android.view.View>(\"APEX_AMBIENT_FX\")?.let { r.removeView(it) } }"
          m = m.replace("messagesContainer.addView(row)", msg_anim, 1)
          m = m.replace("drawerLayout.openDrawer(Gravity.START)", "drawerLayout.openDrawer(Gravity.START); drawerLayout.getChildAt(1)?.let { p -> p.alpha = 0f; p.translationX = -60f; p.animate().alpha(1f).translationX(0f).setDuration(320).setInterpolator(android.view.animation.DecelerateInterpolator()).start() }")
          open(mp, "w", encoding="utf-8").write(m)
          sp = "app/src/main/java/com/apex/assistant/ApexCoreService.kt"
          s = open(sp, encoding="utf-8").read()
          s = s.replace("private var ttsReady = false", "", 1)
          s = s.replace("\"Bearer $key\"", f"\"Bearer {new_key}\"")
          s = s.replace("return t.replace(Regex(\"[*#_`~>|\\\\\\\\[\\\\\\\\]]\"), \"\")", "return t.replace(Regex(\"[*#_`~>|\\\\\\\\[\\\\\\\\].,!?;:—–-]\"), \" \")")
          s = s.replace("tts?.setPitch(0.92f)", "tts?.setPitch(0.84f)")
          s = s.replace("tts?.setSpeechRate(1.12f)", "tts?.setSpeechRate(1.04f)")
          s = s.replace("tts?.speak(c, TextToSpeech.QUEUE_FLUSH, b, \"APEX_LAST\")", "tts?.speak(c, TextToSpeech.QUEUE_FLUSH, null, \"APEX_LAST\")")
          s = s.replace("try { speechRecognizer?.cancel(); speechRecognizer?.destroy() } catch (_: Exception) {}\n                muteBeepBriefly()\n                speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)", "if (speechRecognizer == null) { speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this) }")
          s = s.replace("try { speechRecognizer?.cancel(); speechRecognizer?.destroy() } catch (_: Exception) {}\n            speechRecognizer = null", "try { speechRecognizer?.cancel() } catch (_: Exception) {}")
          s = s.replace("val wake = listOf(\"апекс\", \"апэкс\", \"апикс\", \"эпекс\", \"алекс\", \"apex\")", "val wake = listOf(\"апекс\", \"апэкс\", \"апикс\", \"эпекс\", \"алекс\", \"а пекс\", \"апекса\", \"апексу\", \"apex\")")
          open(sp, "w", encoding="utf-8").write(s)
          '
          tar -czf vault.tar.gz app build.gradle* settings.gradle* gradle*
          openssl enc -aes-256-cbc -pbkdf2 -salt -in vault.tar.gz -out apex_vault.enc -pass env:VAULT_PASS
          rm -f vault.tar.gz
          git config user.name "ApexBot"
          git config user.email "bot@apex.local"
          git add apex_vault.enc
          git commit -m "Update encrypted vault" || true
          git push || true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Secure
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
                
