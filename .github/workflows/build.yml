name: Build Apex AI Secure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Direct AI, Telegram Rating & Clean Voice
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in apex_vault.enc -out vault.tar.gz -pass env:VAULT_PASS
          tar -xzf vault.tar.gz && rm -f vault.tar.gz
          cat << 'EOF' > patch_direct.py
          import re
          tg_tok = "8813383592:AAEq3jtBj3G9qeSr3KRSvUhOEFpmCHYfuog"
          tg_url = f"https://api.telegram.org/bot{tg_tok}/sendMessage"
          mp = "app/src/main/java/com/apex/assistant/MainActivity.kt"
          m = open(mp, encoding="utf-8").read()
          m = re.sub(r"https://[a-zA-Z0-9.-]+\.workers\.dev", tg_url, m)
          m = re.sub(r'Base64\.decode\("aHR0cHM6Ly9[^"]+"[^)]+\)', f'"{tg_url}".toByteArray()', m)
          open(mp, "w", encoding="utf-8").write(m)
          sp = "app/src/main/java/com/apex/assistant/ApexCoreService.kt"
          s = open(sp, encoding="utf-8").read()
          s = s.replace("https://api.groq.com/openai/v1/chat/completions", "https://text.pollinations.ai/openai")
          s = s.replace("https://gen.pollinations.ai/v1/chat/completions", "https://text.pollinations.ai/openai")
          s = s.replace('"llama-3.3-70b-versatile"', '"openai"')
          s = s.replace('listOf("meta-llama/llama-4-scout-17b-16e-instruct", "llama-3.2-11b-vision-preview")', 'listOf("openai", "openai-large")')
          s = s.replace('listOf("llama-3.3-70b-versatile", "llama-3.1-8b-instant")', 'listOf("openai", "mistral")')
          direct_fn = 'private fun postJson(urlStr: String, authHeader: String?, bodyObj: JSONObject): Pair<Int, String> {\n            val target = if (urlStr.contains("workers.dev") || urlStr.contains("groq.com")) "https://text.pollinations.ai/openai" else urlStr\n            val sendObj = if (bodyObj.has("payload")) bodyObj.getJSONObject("payload") else bodyObj\n            sendObj.put("model", "openai")\n            val c = URL(target).openConnection() as HttpURLConnection\n            c.requestMethod = "POST"\n            c.setRequestProperty("Content-Type", "application/json")\n            c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126.0 Mobile Safari/537.36")\n            c.connectTimeout = 10000; c.readTimeout = 25000; c.doOutput = true\n            OutputStreamWriter(c.outputStream).use { it.write(sendObj.toString()) }\n            val code = c.responseCode\n            val txt = (if (code in 200..299) c.inputStream else c.errorStream)?.bufferedReader()?.use { it.readText() } ?: ""\n            return Pair(code, txt)\n        }'
          s = re.sub(r'private fun postJson\(urlStr: String.*?\n        \}', direct_fn, s, flags=re.S)
          s = re.sub(r'val am = getSystemService.*?speechRecognizer = SpeechRecognizer\.createSpeechRecognizer\(this\)', 'speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)', s, flags=re.S)
          s = s.replace("2200L", "1400L").replace("2200)", "1400)")
          open(sp, "w", encoding="utf-8").write(s)
          EOF
          python3 patch_direct.py && rm -f patch_direct.py
          tar -czf vault.tar.gz app build.gradle* settings.gradle* gradle*
          openssl enc -aes-256-cbc -pbkdf2 -salt -in vault.tar.gz -out apex_vault.enc -pass env:VAULT_PASS
          rm -f vault.tar.gz
          git config user.name "ApexBot"
          git config user.email "bot@apex.local"
          git add apex_vault.enc
          git commit -m "Direct Pollinations AI + Telegram bot rating + clean voice" || true
          git push || true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Secure
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
