name: Clean Repo Structure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove Old Patch Files
        run: |
          git config user.name "ApexBot"
          git config user.email "bot@apex.local"
          git rm -rf --ignore-unmatch apex_vault.enc bot.py build_patch.py fbe20faddd611f1b664da40* final_fix.py fix_all.py polish_apex.py push.json update_code.py worker.js app src
          git commit -m "Clean old patch files and prepare fresh architecture" || true
          git push || true
          
