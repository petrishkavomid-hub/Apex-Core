name: Build Apex AI Secure

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Secure Gateway & Encrypt Vault
        env:
          VAULT_PASS: ${{ secrets.VAULT_PASS }}
        run: |
          git checkout bb021fd -- fix_all.py update_code.py final_fix.py
          sed -i 's/^ c2 =/c2 =/; s/^ c3 =/c3 =/' final_fix.py
          pip install pillow -q && python3 final_fix.py && python3 update_code.py
          python3 -c '
          import re, base64, os
          gw = "https://" + "purple-butterfly-e9ca." + "ildqnangel." + "workers.dev"
          gw_b64 = base64.b64encode(gw.encode()).decode()
          groq_url = "https://" + "://groq.com"
          new_key = "gsk_" + "7crDRsbMxuxitQFx41MTWGdyb3FYho1GHzm7F1stz06ZobPZdUxv"
          man_path = "app/src/main/AndroidManifest.xml"
          if os.path.exists(man_path):
              man = open(man_path, encoding="utf-8").read()
              if "QUERY_ALL_PACKAGES" not in man:
                  man = man.replace("<application", "<uses-permission android:name=\"android.permission.QUERY_ALL_PACKAGES\" />\n    <application", 1)
                  open(man_path, "w", encoding="utf-8").write(man)
          mp = "app/src/main/java/com/apex/assistant/MainActivity.kt"
          m = open(mp, encoding="utf-8").read()
          m = re.sub(r"const val BOT_TOKEN = \"[^\"]*\"", "const val BOT_TOKEN = \"\"", m)
          m = re.sub(r"return \"gsk_[^\"]+\"", f"return \"{new_key}\"", m)
          m = m.replace("aHR0cHM6Ly9hcGV4LWJvdC5wZXRyaXNoa2F2b21pZC53b3JrZXJzLmRldg==", gw_b64).replace("https://workers.dev", gw)
          m = m.replace("URL(\"${tgApiHost()}/bot$BOT_TOKEN/sendMessage\")", f"URL(\"{gw}\")")
          m = m.replace("put(\"chat_id\", CREATOR_TG_ID.toLong())", "put(\"app_event\", JSONObject().put(\"type\", \"send_tg\").put(\"text\", text))")
          m = m.replace("                put(\"text\", text)\n", "")
          m = m.replace("textSize = 44f", "textSize = 58f").replace("cornerRadius = 36f", "cornerRadius = 56f")
          anim_logo = "elevation = 20f; android.animation.ObjectAnimator.ofPropertyValuesHolder(this, android.animation.PropertyValuesHolder.ofFloat(\"scaleX\", 1f, 1.08f, 1f), android.animation.PropertyValuesHolder.ofFloat(\"scaleY\", 1f, 1.08f, 1f), android.animation.PropertyValuesHolder.ofFloat(\"rotation\", -2f, 2f, -2f)).apply { duration = 2800; repeatCount = android.animation.ValueAnimator.INFINITE; interpolator = android.view.animation.AccelerateDecelerateInterpolator(); start() }"
          m = m.replace("elevation = 8f", anim_logo, 1)
          m = m.replace("arrayOf(\"Думаю •  \", \"Думаю  • \", \"Думаю   •\", \"Думаю •••\")", "arrayOf(\"Апекс думает  ● ○ ○\", \"Апекс думает  ○ ● ○\", \"Апекс думает  ○ ○ ●\", \"Апекс думает  ● ● ●\")")
          m = m.replace("hAnim.postDelayed(this, 300)", "hAnim.postDelayed(this, 220)")
          m = m.replace("messagesContainer.addView(row)", "messagesContainer.addView(row); row.alpha = 0f; row.translationY = 45f; row.animate().alpha(1f).translationY(0f).setDuration(280).start()", 1)
          luntik_run = "addChatBubble((if (imgB64 != null) \"📷 [Фото прикреплено]\\n\" else \"\") + promptToSend, true); if (promptToSend.contains(\"лунтик\", true) || promptToSend.contains(\"я родился\", true)) { val root = window.decorView as? android.view.ViewGroup; if (root != null) { var phase = 0f; val lv = object : android.view.View(this@MainActivity) { val pBody = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor(\"#B388FF\") }; val pDark = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor(\"#6A1B9A\") }; val pWhite = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }; val pBlack = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.BLACK }; val pTxt = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE; textSize = 34f; typeface = Typeface.DEFAULT_BOLD }; override fun onDraw(c: Canvas) { val leg = Math.sin(phase.toDouble()).toFloat() * 18f; c.drawOval(75f + leg, 155f, 105f + leg, 195f, pDark); c.drawOval(115f - leg, 155f, 145f - leg, 195f, pDark); c.drawOval(65f, 95f, 155f, 175f, pBody); c.drawCircle(110f, 138f, 16f, pDark); c.drawOval(55f - leg, 105f, 80f - leg, 145f, pBody); c.drawOval(140f + leg, 105f, 165f + leg, 145f, pBody); val ear = leg * 0.4f; c.save(); c.rotate(-22f + ear, 85f, 55f); c.drawOval(72f, 5f, 96f, 60f, pBody); c.drawOval(74f, 5f, 94f, 24f, pDark); c.restore(); c.save(); c.rotate(22f - ear, 135f, 55f); c.drawOval(124f, 5f, 148f, 60f, pBody); c.drawOval(126f, 5f, 146f, 24f, pDark); c.restore(); c.save(); c.rotate(-52f - ear, 75f, 65f); c.drawOval(62f, 15f, 84f, 68f, pBody); c.drawOval(64f, 15f, 82f, 32f, pDark); c.restore(); c.save(); c.rotate(52f + ear, 145f, 65f); c.drawOval(136f, 15f, 158f, 68f, pBody); c.drawOval(138f, 15f, 156f, 32f, pDark); c.restore(); c.drawCircle(110f, 75f, 40f, pBody); c.drawCircle(83f, 82f, 8f, pDark); c.drawCircle(137f, 82f, 8f, pDark); c.drawCircle(96f, 68f, 11f, pWhite); c.drawCircle(124f, 68f, 11f, pWhite); c.drawCircle(99f, 68f, 5f, pBlack); c.drawCircle(127f, 68f, 5f, pBlack); c.drawArc(95f, 75f, 125f, 95f, 15f, 150f, false, pDark); c.drawRoundRect(175f, 25f, 395f, 78f, 24f, 24f, pDark); c.drawText(\"Я родился!\", 198f, 62f, pTxt) } }; lv.layoutParams = android.widget.FrameLayout.LayoutParams(420, 210); lv.y = resources.displayMetrics.heightPixels * 0.68f; lv.x = -430f; root.addView(lv); val runner = android.animation.ValueAnimator.ofFloat(0f, 28f).apply { duration = 3400; addUpdateListener { phase = it.animatedValue as Float; lv.invalidate() }; start() }; lv.animate().x(resources.displayMetrics.widthPixels + 430f).setDuration(3400).withEndAction { runner.cancel(); root.removeView(lv) }.start(); android.animation.ObjectAnimator.ofFloat(lv, \"translationY\", lv.y, lv.y - 42f, lv.y).apply { duration = 380; repeatCount = 8; start() } } }"
          m = m.replace("addChatBubble((if (imgB64 != null) \"📷 [Фото прикреплено]\\n\" else \"\") + promptToSend, true)", luntik_run, 1)
          open(mp, "w", encoding="utf-8").write(m)
          sp = "app/src/main/java/com/apex/assistant/ApexCoreService.kt"
          s = open(sp, encoding="utf-8").read()
          s = s.replace("private var ttsReady = false", "", 1)
          s = s.replace("val c = URL(urlStr).openConnection() as HttpURLConnection", f"val targetUrl = if (urlStr.contains(\"groq\") || urlStr.contains(\"workers\") || urlStr.contains(\"pollinations\")) \"{groq_url}\" else urlStr; val c = URL(targetUrl).openConnection() as HttpURLConnection")
          s = s.replace("if (auth != null) c.setRequestProperty(\"Authorization\", auth)", f"c.setRequestProperty(\"Authorization\", \"Bearer {new_key}\")")
          s = s.replace("return t.replace(Regex(\"[*#_`~>|\\\\\\\\[\\\\\\\\]]\"), \"\")", "return t.replace(Regex(\"[*#_`~>|\\\\\\\\[\\\\\\\\].,!?;:—–-]\"), \" \")")
          s = s.replace("tts?.speak(c, TextToSpeech.QUEUE_FLUSH, b, \"APEX_LAST\")", "tts?.speak(c, TextToSpeech.QUEUE_FLUSH, null, \"APEX_LAST\")")
          s = s.replace("try { speechRecognizer?.cancel(); speechRecognizer?.destroy() } catch (_: Exception) {}\n                muteBeepBriefly()\n                speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)", "if (speechRecognizer == null) { speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this) }")
          s = s.replace("try { speechRecognizer?.cancel(); speechRecognizer?.destroy() } catch (_: Exception) {}\n            speechRecognizer = null", "try { speechRecognizer?.cancel() } catch (_: Exception) {}")
          s = s.replace("val wake = listOf(\"апекс\", \"апэкс\", \"апикс\", \"эпекс\", \"алекс\", \"apex\")", "val wake = listOf(\"апекс\", \"апэкс\", \"апикс\", \"эпекс\", \"алекс\", \"а пекс\", \"апекса\", \"апексу\", \"apex\")")
          open(sp, "w", encoding="utf-8").write(s)
          '
          tar -czf vault.tar.gz app build.gradle* settings.gradle* gradle*
          openssl enc -aes-256-cbc -pbkdf2 -salt -in vault.tar.gz -out apex_vault.enc -pass env:VAULT_PASS
          rm -f vault.tar.gz
          git config user.name "ApexBot"
          git config user.email "bot@apex.local"
          git add apex_vault.enc
          git commit -m "Update encrypted vault" || true
          git push || true

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Secure
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
          
