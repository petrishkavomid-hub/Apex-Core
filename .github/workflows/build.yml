name: Find Exact Files

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find exact files with Pollinations key and Mic loop
        run: |
          echo "=== ФАЙЛЫ В ПРОЕКТЕ ==="
          find app/src -type f
          echo "=== ГДЕ ЛЕЖИТ POLLINATIONS / КЛЮЧ ==="
          grep -rn -E "pollinations|pk_|Bearer|Authorization" app/src/ || true
          echo "=== ГДЕ ВКЛЮЧАЕТСЯ/ВЫКЛЮЧАЕТСЯ МИКРОФОН ==="
          grep -rn -E "SpeechRecognizer|startListening|AudioManager|STREAM_" app/src/ || true
          
