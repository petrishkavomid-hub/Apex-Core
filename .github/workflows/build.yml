                      }
                  }
                  val scroll = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, dp(380))
                  }
                  val aboutText = "О приложении Apex AI\n\nApex AI Assistant — интеллектуальный персональный помощник, созданный для общения, получения информации и выполнения голосовых команд.\n\nApex помогает отвечать на вопросы, поддерживать диалог, анализировать изображения, работать с голосовыми запросами и предоставлять полезные функции прямо на вашем Android-устройстве.\n\nНаша цель — сделать взаимодействие с искусственным интеллектом удобным, понятным и безопасным.\n\nКонфиденциальность\n\nМы понимаем, что доверие пользователей — важная часть любого цифрового продукта.\n\nApex может обрабатывать данные, необходимые для работы его функций: текстовые запросы, голосовые команды, изображения и другую информацию, которую пользователь самостоятельно отправляет приложению.\n\nДоступ к функциям устройства используется для выполнения соответствующих возможностей Apex. Приложение не должно запрашивать разрешения без конкретной необходимости.\n\nНе передавайте через приложение пароли, коды подтверждения, банковские данные и другую конфиденциальную информацию.\n\nЗачем нужны разрешения?\n\n🎙 Микрофон\nИспользуется для распознавания голоса, голосового общения с Apex и выполнения голосовых команд. Без этого разрешения голосовые функции могут быть недоступны.\n\n📱 Запись экрана\nМожет использоваться для функций, связанных с захватом содержимого экрана или его демонстрацией. Android показывает системное подтверждение перед началом захвата. Разрешение следует предоставлять только тогда, когда вы запускаете соответствующую функцию.\n\n🔔 Уведомления\nНужны для отображения уведомлений Apex: сообщений о работе приложения, ответов и других предусмотренных приложением событий.\n\n📷 Камера и изображения\nИспользуются, если вы хотите сделать снимок или отправить изображение для анализа искусственным интеллектом.\n\n🌐 Доступ к интернету\nНеобходим для соединения с серверами, обработки запросов искусственным интеллектом, получения ответов и работы сетевых функций.\n\n⚙️ Другие разрешения\nДополнительные разрешения могут запрашиваться для отдельных функций приложения. Перед предоставлением доступа вы можете ознакомиться с системным запросом Android и решить, разрешать его или нет.\n\nВаш контроль\n\nВы самостоятельно управляете разрешениями Apex через настройки Android. Вы можете в любой момент отозвать доступ к микрофону, камере, уведомлениям и другим функциям.\n\nОтключение отдельных разрешений может ограничить соответствующие возможности приложения, но не обязательно повлияет на остальные функции.\n\nApex AI Assistant — технологии, которые должны быть понятными пользователю.\n\nСпасибо, что пользуетесь Apex AI.\n\nСоздатель: Derek Stealth"
                  

                  val tv = TextView(this).apply {
                      text = aboutText
                      setTextColor(Color.parseColor("#E2E8F0"))
                      textSize = 13f
                      setLineSpacing(dp(3).toFloat(), 1f)
                  }
                  scroll.addView(tv)
                  outer.addView(scroll)

                  val dlg = AlertDialog.Builder(this).setView(outer).create()
                  dlg.window?.setBackgroundDrawableResource(android.R.color.transparent)

                  val tgBtn = TextView(this).apply {
                      text = "Открыть канал @Apexassistantcore"
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      setTypeface(null, Typeface.BOLD)
                      gravity = Gravity.CENTER
                      setPadding(dp(14), dp(11), dp(14), dp(11))
                      background = GradientDrawable().apply { setColor(Color.parseColor("#0284C7")); cornerRadius = dp(14).toFloat() }
                      layoutParams = LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(12) }
                      setOnClickListener { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("https://t.me/Apexassistantcore"))) }
                  }
