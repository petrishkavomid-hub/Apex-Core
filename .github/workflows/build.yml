          orb += '                (etRef?.parent as? android.view.ViewGroup)?.let { bar -> bar.setPadding((10 * density).toInt(), (7 * density).toInt(), (10 * density).toInt(), (7 * density).toInt()); (bar.parent as? android.view.ViewGroup)?.setPadding((14 * density).toInt(), (6 * density).toInt(), (14 * density).toInt(), (26 * density).toInt()); val glowDrawable = object : android.graphics.drawable.Drawable() { val pFill = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#0B0F19"); style = Paint.Style.FILL }; val pGlow = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE; strokeWidth = 2.4f * density }; override fun draw(canvas: Canvas) { val r = android.graphics.RectF(bounds.left + 2f * density, bounds.top + 2f * density, bounds.right - 2f * density, bounds.bottom - 2f * density); val rad = 28f * density; canvas.drawRoundRect(r, rad, rad, pFill); val cols = intArrayOf(Color.parseColor("#38BDF8"), Color.parseColor("#8B5CF6"), Color.parseColor("#EC4899"), Color.parseColor("#10B981"), Color.parseColor("#38BDF8")); val sg = android.graphics.SweepGradient(r.centerX(), r.centerY(), cols, null); val mx = android.graphics.Matrix(); mx.postRotate(borderPhase, r.centerX(), r.centerY()); sg.setLocalMatrix(mx); pGlow.shader = sg; canvas.drawRoundRect(r, rad, rad, pGlow) }; override fun setAlpha(a: Int) {}; override fun setColorFilter(cf: android.graphics.ColorFilter?) {}; override fun getOpacity(): Int = android.graphics.PixelFormat.TRANSLUCENT }; bar.background = glowDrawable; android.animation.ValueAnimator.ofFloat(0f, 360f).apply { duration = 3800L; repeatCount = android.animation.ValueAnimator.INFINITE; interpolator = android.view.animation.LinearInterpolator(); addUpdateListener { borderPhase = it.animatedValue as Float; bar.invalidate() }; start() } }\n'
