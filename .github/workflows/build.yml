name: Build Apex AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Apex AI Fixes
        run: |
          git checkout bb021fd -- fix_all.py update_code.py final_fix.py
          pip install pillow -q && python3 fix_all.py && python3 update_code.py
          python3 -c '
          import re
          for fn in ["ApexCoreService.kt", "MainActivity.kt"]:
              fp = "app/src/main/java/com/apex/assistant/" + fn
              t = open(fp, encoding="utf-8").read()
              t = re.sub(r"[a-zA-Z0-9_?.]+\.adjustStreamVolume\([^)]+\)", "// muted_removed", t)
              t = re.sub(r"[a-zA-Z0-9_?.]+\.setStreamVolume\([^)]+\)", "// vol_removed", t)
              t = t.replace("workflows/main/main/Apex-AI-Update.zip", "workflows/build/main/Apex-AI-Update.zip")
              open(fp, "w", encoding="utf-8").write(t)
          p = "app/src/main/java/com/apex/assistant/ApexCoreService.kt"
          s = open(p, encoding="utf-8").read()
          for m in ["\"openai\"", "\"openai-fast\"", "\"gpt-4o-mini\""]:
              s = s.replace("put(\"model\", " + m + ")", "put(\"model\", \"searchgpt\")").replace("\"model\": " + m, "\"model\": \"searchgpt\"")
          s = s.replace("for (m in listOf(\"openai\", \"gemini\", \"openai-fast\", \"gpt-4o-mini\")) {", "for (m in listOf(\"gemini\", \"searchgpt\", \"openai-large\", \"openai\")) {")
          s = s.replace("if (code in 200..299) {", "if (code in 200..299 && !raw.contains(\"credits\", true) && !raw.contains(\"top-up\", true) && !raw.contains(\"не могу определить личность\", true)) {")
          s = re.sub(r"if \(prompt\.isBlank\(\)\) \".*?\" else prompt", "if (prompt.isBlank()) \"Внимательно изучи фото: кто или что на нём изображено? Назови имя актёра или персонажа, если узнаваем, и ответь без смайликов.\" else \"$prompt (Внимательно рассмотри фото и логотипы, назови имя, если узнаваем. Без смайликов).\"", s)
          s = s.replace("tts?.setPitch(1.0f)", "tts?.setPitch(0.85f)")
          ns = "val creatorFlag = isCreator || prefs.getBoolean(\"dev_unlocked\", false) || prefs.getBoolean(\"is_admin\", false); val rolePrompt = if (creatorFlag) \"ТЫ ОБЩАЕШЬСЯ СО СВОИМ СОЗДАТЕЛЕМ СЕРГЕЕМ (DEREK STEALTH)! Обращайся к нему Босс, Шеф, Дерек или Серёга, никогда не называй сэр.\" else \"Ты общаешься с пользователем как умный и спокойный напарник.\"; val sys = \"Ты — Apex AI (сейчас 2026 год). $rolePrompt $ctxInfo $noGreetRule ЗАПРЕЩЕНО использовать любые смайлики и эмодзи. Никогда не выдумывай факты и биографии артистов (Kizaru — Олег Нечипоренко, Haunted Family; Miyagi & Эндшпиль — дуэт из Владикавказа, Hajime). На простые фразы отвечай коротко, на сложные — развёрнуто. На фото узнавай актёров и персонажей.\""
          s = re.sub(r"val sys = \".*?\"", ns, s, count=1)
          s = s.replace("if (cmd.isEmpty()) { speakClean(\"Слушаю вас.\"); return }", "if (cmd.isEmpty()) { val dev = MainActivity.CREATOR_IDS.contains(Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: \"\") || getSharedPreferences(\"apex_prefs\", Context.MODE_PRIVATE).getBoolean(\"dev_unlocked\", false); speakClean(if (dev) \"На связи, Шеф.\" else \"Слушаю вас.\"); return }")
          open(p, "w", encoding="utf-8").write(s)
          '

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apex-AI-Update
          path: app/build/outputs/apk/debug/app-debug.apk
          
